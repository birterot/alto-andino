<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coffee">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Coffee</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
<link rel="stylesheet" href="assets/css/base.css">
<style>
.hero{display:flex;align-items:center;gap:20px;margin:8px 0 32px;--f:light-dark(#EADFD2,#33281F);--s:light-dark(#7A5236,#C09670)}
.hero svg{width:96px;height:auto;flex:none}
.hero .sub{margin:6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;padding:20px;min-height:132px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none}
.tile:hover{border-color:var(--ink)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tile svg{width:28px;height:28px;color:var(--accent)}
.tile h2{margin:6px 0 0;font-size:19px}
.tile p{margin:0;color:var(--mut);font-size:14px}
.tile.main{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:0;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.main svg,.tile.main p{color:var(--bg);opacity:.85}
.tile.main h2{margin:0}
</style>
</head>
<body>
<main>
<div class="hero">
  <div id="cup" aria-hidden="true"></div>
  <div>
    <h1>Coffee</h1>
    <p class="sub">Learn it, log it, taste the progress.</p>
  </div>
</div>
<div class="tiles">
  <a class="tile main" href="journal/index.html#log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <div><h2>Log a brew</h2><p>Pick a coffee, set the dial-in, rate the cup.</p></div>
  </a>
  <a class="tile" href="journal/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 17a3 3 0 013-3h11"/></svg>
    <h2>Journal</h2><p>Our coffees, bags and brews.</p>
  </a>
  <a class="tile" href="trends/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 15l4-5 3 3 4-6"/></svg>
    <h2>Trends</h2><p>How flavours change after roasting and opening.</p>
  </a>
  <a class="tile" href="chapters/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-5 0-8-3.5-8-8 0-4.5 3-8 8-8s8 3.5 8 8c0 4.5-3 8-8 8z" transform="rotate(35 12 12)"/><path d="M12 4c-2 5 2 8 0 16"/></svg>
    <h2>Bean to cup</h2><p>Notes from the book: processing, roasting, freshness and brewing devices.</p>
  </a>
</div>
</main>
<script src="assets/js/shared.js"></script>
<script>document.getElementById("cup").innerHTML = window.cupSvg();</script>
<script src="assets/js/nav.js" defer></script>
</body>
</html>
