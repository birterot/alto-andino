<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alto Andino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Alto Andino</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="assets/css/base.css">
<script>
// Signed out (no login saved in this browser): straight to the sign-in page, Home is only for signed-in people.
(function () {
  var ok = false;
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^sb-.+-auth-token$/.test(k)) { var v = JSON.parse(localStorage.getItem(k) || "null"); if (v && (v.refresh_token || v.access_token) && v.user) ok = true; } } } catch (e) { ok = true; }   // no storage at all: let the page decide
  if (!ok) location.replace("journal/index.html");
})();
</script>
<script>
// the opening animation (assets/js/intro.js): once per app start, not with "reduce motion"
try { if (!sessionStorage.getItem("alto.intro") && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { document.documentElement.classList.add("intro"); setTimeout(function () { document.documentElement.classList.remove("intro"); }, 8000); } } catch (e) {}
</script>
<style>
/* opening animation (assets/js/intro.js): the page waits hidden while the mountain is drawn in the middle */
#introlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;color:var(--brand);cursor:pointer;-webkit-tap-highlight-color:transparent}
#introlay .introbox{position:relative;width:200px;aspect-ratio:599/397;will-change:transform;transform-origin:50% 50%}
#introlay .il{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;backface-visibility:hidden}
#introlay .plant{transform-origin:55.1% 46.3%;will-change:transform}
#introlay .line{will-change:opacity}
#introlay .inner{will-change:opacity}
html.intro .hero .mark{visibility:hidden}
html.intro .hero h1,html.intro #today,html.intro .topnav{opacity:.001;will-change:opacity,transform}   /* .001, not 0: painted up front, so fading in costs nothing */
html.intro body::before{opacity:0}
.hero{display:flex;flex-direction:column;align-items:center;gap:18px;margin:4px 0 26px;text-align:center}
.hero .mark{width:168px;color:var(--brand)}.hero .mark svg{display:block;width:100%;height:auto}
.hero h1.wm{width:220px;margin:0}
.tile{display:flex;flex-direction:row;align-items:center;gap:10px;padding:12px 14px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none}
.tile:hover{border-color:var(--ink)}
.tile[hidden],.tiles[hidden]{display:none}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tile svg{width:22px;height:22px;color:var(--accent);flex:none}
.tile h2{margin:0;font-size:15.5px;line-height:1.25}
.tile.main{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:0;margin:0 0 14px;padding:18px 20px;background:var(--act);color:var(--on-act);border-color:var(--act);box-shadow:0 8px 22px rgba(60,35,15,.18)}
.tile.main svg{width:28px;height:28px;color:var(--on-act)}
.tile.main p{display:block;margin:2px 0 0;font-size:14px;color:var(--on-act);opacity:.85}
.tile.main h2{margin:0;font-size:20px}
/* today: greeting, open bags, one note */
#today{margin:-4px 0 18px}
#today .hi{text-align:center;margin:0 0 16px}
#today .greet{margin:0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:20px;color:var(--ink)}
#today .stat{margin:2px 0 0;font-size:13.5px;color:var(--mut)}
#today .bags{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:none;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#today .bags::-webkit-scrollbar{display:none}
#today .bagc{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:10px;min-width:180px;max-width:240px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none}
#today .bagc svg{flex:none;color:var(--accent)}
#today .bagc .bo{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
#today .bagc .bo.thin{stroke-width:1.3;opacity:.7}
#today .bagc .bf{fill:var(--accent);opacity:.55}
#today .bt{display:flex;flex-direction:column;min-width:0}
#today .bt strong{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#today .bt small{font-size:12.5px;color:var(--mut)}
/* the month in review (assets/js/home.js): a note in the dark shade, first while it is shown */
#today .note.dark{background:var(--act);border-color:var(--act);color:var(--on-act)}
#today .note.dark .nk,#today .note.dark .go{color:var(--on-act)}
#today .note.dark .dots i{background:color-mix(in srgb,var(--on-act) 35%,transparent)}#today .note.dark .dots i.on{background:var(--on-act)}
.mrev .mnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 10px}
.mrev .mnums div{padding:10px 10px 8px;border-radius:12px;background:color-mix(in srgb,var(--on-act) 12%,transparent)}
.mrev .mnums b{display:block;font-size:24px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.mrev .mnums small{font-size:12.5px;opacity:.85}
.mrev .mlist{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px}
.mrev .mlist li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.mrev .mlist svg.me{flex:none;width:19px;height:19px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
#today .note{padding:12px 16px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
#today .note:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#today .nh{display:flex;align-items:center;justify-content:space-between;gap:10px}
#today .nk{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
#today .dots{display:flex;gap:4px}
#today .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
#today .dots i.on{background:var(--accent)}
#today .nt{margin:4px 0 0;font-size:14.5px;line-height:1.45}
#today .go{display:inline-block;margin-top:6px;font-size:13.5px;color:var(--ink)}
#today .nh .info{margin-left:auto;margin-right:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);font:600 12.5px/20px Georgia,serif;font-style:italic;padding:0;cursor:pointer}
#today .nh .info[aria-expanded=true]{background:var(--accent);border-color:var(--accent);color:var(--card)}
#today .ns a{color:var(--ink)}
#today .ns{margin:6px 0 0;font-size:12.5px;color:var(--mut);line-height:1.4}
#today .cafc{margin:12px 0 0}
#today .cplot{position:relative;padding-top:16px}
#today .cafc svg{display:block;width:100%;height:64px;overflow:visible}
#today .cafc .ca{fill:var(--accent);opacity:.16;stroke:none}
#today .cafc .cl{fill:none;stroke:var(--accent);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#today .cafc .cl.fut{opacity:.45;stroke-dasharray:1 0}
#today .cafc .c50{fill:none;stroke:var(--mut);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.8}
#today .cafc .cbase{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#today .cafc .cn{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
#today .cplot span{position:absolute;font-size:11.5px;line-height:1;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
#today .cplot .l50{right:0;margin-bottom:3px;padding:0 3px;border-radius:4px;background:var(--card)}
#today .cafc .cbed{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
#today .cplot .lbed{top:0;transform:translateX(-50%);color:var(--accent);font-weight:600}
#today .cplot .lbed.r{transform:translateX(-100%)}
#today .cplot .lnow{top:0;transform:translateX(-50%);color:var(--ink);font-weight:600}
#today .cplot .lnow.r{transform:translateX(-100%)}
#today .cplot .lnow.l{transform:none}
#today .cax{position:relative;height:16px;margin-top:4px}
#today .cax span{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
#today .cax span:first-child{transform:none}
#today .cax span:last-child{transform:translateX(-100%)}
#today .tour{margin-bottom:12px;padding:12px 16px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--accent)}
#today .tour .tskip{font:inherit;font-size:13.5px;border:0;background:none;color:var(--mut);padding:4px 2px;cursor:pointer}
#today .tour .tt{margin:6px 0 0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:18px;color:var(--ink)}
#today .tour .trow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
#today .tour .trow .go{margin-top:0}
#today .tour .tnav{display:flex;gap:8px}
#today .tour .tnav button{font:inherit;font-size:14px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#today .tour .tnav .next{background:var(--act);border-color:var(--act);color:var(--on-act)}
#today .ask{margin-bottom:12px;padding:12px 16px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
#today .ask[hidden]{display:none}
#today .faces{display:flex;gap:8px;margin-top:10px}
#today .face{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
#today .face svg.fe{width:30px;height:30px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#today .face .fl{font-size:13px;color:var(--mut)}
#today .note{touch-action:pan-y}
#today .note.sl{animation:nsl .22s ease-out}#today .note.sr{animation:nsr .22s ease-out}
@keyframes nsl{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
@keyframes nsr{from{transform:translateX(-18px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#today .note.sl,#today .note.sr{animation:none}}
#today .note.out{margin-bottom:10px;border-color:var(--act);cursor:default}
</style>
</head>
<body>
<main>
<div class="hero">
  <div class="mark" data-mark></div>
  <h1 data-wordmark>Alto Andino</h1>
</div>
<section id="today" aria-label="Today"></section>
<div class="tiles">
  <a class="tile main" href="journal/index.html#log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5h12v3a5 5 0 01-5 5h-2a5 5 0 01-5-5v-3z M15.5 12h1.3a2.3 2.3 0 010 4.6h-1.6 M3 21h14 M19 3v5.5 M16.25 5.75h5.5"/></svg>
    <div><h2>Log a brew</h2><p>Pick a coffee and note the dial-in.</p></div>
  </a>
</div>
<section id="activity" aria-label="Activity" hidden></section>
</main>
<script src="data/facts.js" defer></script>
<script src="assets/js/config.js" defer></script>
<script src="assets/js/caffeine.js" defer></script>
<script src="assets/js/feed.js?v=4" defer></script>
<script src="assets/js/home.js?v=2" defer></script>
<script src="assets/js/nav.js?v=7" defer></script>
<script src="assets/js/intro.js" defer></script>
</body>
</html>
