<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alto Andino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Trends | Alto Andino</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Chart colours. Flavours and people use a colour set that was checked for colour blindness and contrast
   (flavours: sour, sweet, bitter, balance in this fixed order; people: first and second person).
   Star ratings use one coffee-brown scale, light to dark (1 to 5 stars). */
:root{
  --f-sour:light-dark(#2a78d6,#3987e5);--f-sweet:light-dark(#eb6834,#d95926);--f-bitter:light-dark(#1baf7a,#199e70);--f-balance:light-dark(#eda100,#c98500);
  --p1:light-dark(#2a78d6,#3987e5);--p2:light-dark(#eb6834,#d95926);
  --r1:light-dark(#C29F72,#7D5A3B);--r2:light-dark(#AA8253,#9A7650);--r3:light-dark(#8C653A,#B8936A);--r4:light-dark(#6C4A28,#D3B08A);--r5:light-dark(#4C3118,#EBD2B0);
  --one:light-dark(#8A6A4A,#C4A27C);--one-track:light-dark(#E9DFD2,#3A332C);
  --grid:light-dark(#E6E0D6,#34302B);--axis:light-dark(#C9C0B2,#4A443D)
}
.tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;margin:16px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{flex:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.ctl select,.ctl button{font:inherit;font-size:14.5px;min-height:42px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background-color:var(--card);min-width:0;flex:1 1 150px;max-width:100%}
#f-coffee{flex-basis:100%}
.ctl button{flex:0 0 auto;padding:0 16px;cursor:pointer;color:var(--mut)}
.banner{margin:0 0 14px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line);background:var(--card);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin:0 0 18px}
.card h2{margin:0;font-size:19px}
.card .what{margin:4px 0 10px;color:var(--mut);font-size:14px}
.card .take{margin:8px 0 2px;font-size:14.5px;color:var(--ink)}
.box{position:relative;width:100%}
.msg{padding:22px 8px;text-align:center;color:var(--mut);font-size:14px}
svg.ch{display:block;overflow:visible;touch-action:pan-y}
svg.ch text{font-size:12px;fill:var(--mut);font-variant-numeric:tabular-nums}
svg.ch .lab{font-size:12px}
svg.ch .grid{stroke:var(--grid);stroke-width:1}
svg.ch .base{stroke:var(--axis);stroke-width:1}
svg.ch .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .dot{stroke:var(--card);stroke-width:2}
svg.ch .dot.hollow{fill:var(--card);stroke-width:2}
svg.ch .cloud{fill:var(--mut);opacity:.28}
svg.ch .hit{fill:transparent}
svg.ch .pad{fill:transparent;outline:none}
svg.ch .hair{stroke:var(--axis);stroke-width:1}
svg.ch .trail{fill:none;stroke:var(--axis);stroke-width:1.5;stroke-linejoin:round}
svg.ch .lastring{fill:none;stroke:var(--ink);stroke-width:1.5}
svg.ch .zone{fill:var(--one);opacity:.08}
svg.ch .zlab{font-size:11.5px;fill:var(--mut)}
svg.ch .rl{fill:var(--ink);font-size:13px}
svg.ch .val{fill:var(--ink);font-size:13px;font-weight:600}
svg.ch .note{font-size:12px}
svg.ch .endlab{fill:var(--ink);font-size:12.5px}
svg.ch .stem{stroke:var(--axis);stroke-width:2}
svg.ch .pt.faded .dot{stroke:var(--card);stroke-width:1}
svg.ch .pt.hot .dot,svg.ch .bar.hot path,svg.ch .bar.hot .dot{filter:brightness(1.12)}
svg.ch g:focus{outline:none}
svg.ch g:focus-visible .hit{stroke:var(--ink);stroke-width:1.5}
.ctip{position:absolute;z-index:60;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(20,14,10,.18);font-size:13px;color:var(--ink)}
.ctip .ct{color:var(--mut);font-size:12px;margin-bottom:4px}
.ctip .cr{display:flex;align-items:center;gap:7px;line-height:1.5}
.ctip .cr b{font-weight:650}
.ctip .cr span{color:var(--mut)}
.ctip .kl{display:inline-block;width:12px;height:3px;border-radius:2px}
.ctip .kd{display:inline-block;width:9px;height:9px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 2px}
.leg{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:none;font:inherit;font-size:13px;color:var(--ink)}
button.leg{cursor:pointer}
.leg i{width:12px;height:3px;border-radius:2px;background:var(--col)}
.leg i.d{width:10px;height:10px;border-radius:50%}
.leg i.dash{width:16px;background:repeating-linear-gradient(90deg,var(--col) 0 4px,transparent 4px 7px)}
.leg i.h{width:8px;height:8px;border-radius:50%;background:none;border:2px solid var(--mut)}
.leg[aria-pressed=false]{opacity:.45}
.ramp{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.ramp i{display:inline-block;width:14px;height:10px;border-radius:3px}
.subctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.subctl select{font:inherit;font-size:14px;min-height:38px;border-radius:999px;flex:1 1 160px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 18px}
.grid2 h3{margin:12px 0 0;font-size:15px}
.grid2 .small{margin:2px 0 0;color:var(--mut);font-size:13px}
.balm{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;margin-top:8px;font-size:14px}
.balm .tr{height:8px;border-radius:4px;background:var(--one-track);overflow:hidden}
.balm .fl{display:block;height:100%;border-radius:4px;background:var(--f-balance)}
.balm b{font-variant-numeric:tabular-nums}
.balm .small{grid-column:1/-1;margin:0;color:var(--mut);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:4px 0 6px}
.tile{padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.tile .tl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.tile .tl i{width:10px;height:10px;border-radius:50%;background:var(--col)}
.tile .tv{margin-top:2px;font-size:26px;font-weight:600;color:var(--ink)}
.tile .ts{font-size:13px;color:var(--mut)}
.meter{margin:12px 0 0}
.meter .mt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.meter .mt b{font-weight:600}
.meter .mt span{color:var(--mut);white-space:nowrap}
.meter .tr{height:8px;border-radius:4px;background:var(--one-track);margin-top:6px;overflow:hidden}
.meter .fl{height:100%;border-radius:4px;background:var(--one)}
.meter .ms{margin-top:3px;font-size:12.5px;color:var(--mut)}
details.num{margin:10px 0 0;font-size:14px}
details.num summary{cursor:pointer;color:var(--mut)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500}
.hint{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Trends</h1>
<p class="sub">What your brews tell you: how to dial in, when coffees taste best, what you like, and who brews what.</p>

<div class="tabs" role="tablist" aria-label="Trends sections">
  <button class="tab" role="tab" data-v="time" data-t="Over time">Over time</button>
  <button class="tab" role="tab" data-v="dial" data-t="Dial-in">Dial-in</button>
  <button class="tab" role="tab" data-v="fresh" data-t="Freshness">Freshness</button>
  <button class="tab" role="tab" data-v="taste" data-t="Taste">Taste</button>
  <button class="tab" role="tab" data-v="us" data-t="Us">Us</button>
</div>

<div class="ctl" id="filters">
  <select id="f-coffee" aria-label="Coffee"></select>
  <select id="f-device" aria-label="Device"></select>
  <select id="f-who" aria-label="Made by"></select>
  <select id="f-rater" aria-label="Rated by"></select>
  <button id="f-demo" type="button">Example data</button>
</div>
<p class="banner" id="banner" hidden>Example data, to show how the charts look. These are not your brews.</p>

<div id="views"></div>
<p id="msg" class="hint" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/nav.js" defer></script>
<script src="../assets/js/scales.js"></script>
<script src="../assets/js/stars.js"></script>
<script src="../data/devices.js"></script>
<script src="../data/defaults.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
const db = supabase.createClient(SUPA.url, SUPA.key);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };
const CORE = SCALE.PROFILE;   // the taste sliders: sour, sweet, bitter (balance is its own 0 to 5 rating, b.balance)
const BCOL = "var(--f-balance)";
const balText = v => SCALE.balanceText(v);
const avgBal = list => { const v = list.map(b => b.balance).filter(x => x != null); return v.length ? { v: avg(v), n: v.length } : null; };   // unrated brews are left out, never counted as 0
const FCOL = { sour: "var(--f-sour)", sweet: "var(--f-sweet)", bitter: "var(--f-bitter)", balance: "var(--f-balance)" };
const RCOL = n => "var(--r" + Math.min(5, Math.max(1, Math.round(n))) + ")";   // half stars round to the nearer colour
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const D = window.DEFAULTS || {};

const state = { view: "dial", freshC: "", demo: false, signedIn: false, me: null, coffees: [], brews: [], names: {}, coffee: "", device: "", who: "", rater: "", recipe: "", xk: "roast", hidden: new Set() };

// ---------- helpers ----------
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = n => Math.round(n * 10) / 10;
// dates the European way: dd-mm-yyyy (short dd-mm under the weekly columns)
const p2 = n => String(n).padStart(2, "0");
const fmtDate = d => p2(d.getDate()) + "-" + p2(d.getMonth() + 1) + "-" + d.getFullYear();
const fmtShort = d => p2(d.getDate()) + "-" + p2(d.getMonth() + 1);
const fmtIso = iso => { const [y, m, d] = String(iso).slice(0, 10).split("-"); return d + "-" + m + "-" + y; };
const mmss = n => Math.floor(n / 60) + ":" + String(Math.round(n % 60)).padStart(2, "0");
function typeOf(name) { return window.DEVICES && window.DEVICES.typeOf ? window.DEVICES.typeOf(name) : ""; }   // data/devices.js
const isEsp = dev => { const t = typeOf(dev); return t === "espresso" || t === ""; };
const timeText = b => b.time == null ? null : (isEsp(b.device) && b.time < 90 ? b.time + " s" : mmss(b.time) + " min");
const ratioOf = b => !b.dose ? null : isEsp(b.device) ? (b.yld ? b.yld / b.dose : null) : (b.water ? b.water / b.dose : b.yld ? b.yld / b.dose : null);
const numGrind = g => { const m = String(g || "").replace(",", ".").match(/-?\d+(\.\d+)?/); return m ? Number(m[0]) : null; };
const stars = n => Stars.text(n);
const splitOrigin = t => window.DEFAULTS && DEFAULTS.splitOrigin ? DEFAULTS.splitOrigin(t) : { country: t ? String(t).split(",")[0].trim() : null, region: null, countries: [] };
const andList = arr => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
const coffeeOf = id => state.coffees.find(c => c.id === id) || null;
const nameOf = id => (id && state.names[id]) || null;
const people = () => Object.keys(state.names).sort((a, b) => state.names[a].localeCompare(state.names[b]));
const personCol = id => { const i = people().indexOf(id); return i === 0 ? "var(--p1)" : i === 1 ? "var(--p2)" : "var(--mut)"; };
const shown = (a, v) => SCALE.isCore(a) ? v - 5 : v;   // stored -> -5..+5 for the four core flavours

// Several people can rate one brew. With "Rated by" set, a brew counts with that person's stars and taste
// (and only if they rated it); otherwise with the average of everyone who rated it.
const GUEST = "guest";
const raterKey = r => r.guest ? GUEST : r.who;
function asRated(b) {
  const rs = state.rater ? b.ratings.filter(r => raterKey(r) === state.rater) : b.ratings;
  if (state.rater && !rs.length) return null;
  const st = rs.map(r => r.rating).filter(v => v != null), sc = {}, n = {};
  rs.forEach(r => Object.entries(r.scores).forEach(([a, v]) => { sc[a] = (sc[a] || 0) + v; n[a] = (n[a] || 0) + 1; }));
  Object.keys(sc).forEach(a => { sc[a] = sc[a] / n[a]; });
  const bl = rs.map(r => r.balance).filter(v => v != null);
  return Object.assign({}, b, { rating: st.length ? avg(st) : null, balance: bl.length ? avg(bl) : null, scores: sc });
}
// brews after the device / person filters (and the coffee filter where the view uses it)
function filtered(useCoffee) {
  return state.brews.filter(b => (!state.device || b.device === state.device) && (!state.who || b.who === state.who) && (!useCoffee || !state.coffee || b.coffeeId === state.coffee)).map(asRated).filter(Boolean);
}

// ---------- page frame ----------
function card(title, what) {
  const c = el("section", "card"); c.appendChild(el("h2", "", title));
  if (what) c.appendChild(el("p", "what", what));
  $("views").appendChild(c); return c;
}
function chartBox(parent) { const b = el("div", "box"); parent.appendChild(b); return b; }
function numbers(parent, headers, rows) {
  const d = el("details", "num"); d.appendChild(el("summary", "", "Show the numbers"));
  const w = el("div", "wrap"); w.appendChild(Charts.table(headers, rows)); d.appendChild(w); parent.appendChild(d);
}
function empty(parent, text) { parent.appendChild(el("p", "msg", text)); }
function legendItem(parent, color, label, kind, onToggle, pressed) {
  const b = el(onToggle ? "button" : "span", "leg"); if (onToggle) { b.type = "button"; b.setAttribute("aria-pressed", String(pressed)); b.onclick = onToggle; }
  const i = el("i", kind === "dot" ? "d" : kind === "hollow" ? "h" : kind === "dash" ? "dash" : ""); i.style.setProperty("--col", color); b.append(i, document.createTextNode(label)); parent.appendChild(b); return b;
}
function starRamp(parent, withUnrated) {
  const r = el("div", "legend"), w = el("span", "ramp");
  w.appendChild(document.createTextNode("1★"));
  for (let n = 1; n <= 5; n++) { const i = el("i"); i.style.background = RCOL(n); w.appendChild(i); }
  w.appendChild(document.createTextNode("5★"));
  r.appendChild(w);
  if (withUnrated) legendItem(r, "var(--mut)", "not rated", "hollow");
  parent.appendChild(r);
}
function brewTip(b, extra) {
  const c = coffeeOf(b.coffeeId), rows = [];
  (extra || []).forEach(x => rows.push(x));
  if (b.rating) rows.push({ value: stars(b.rating), label: b.dialin ? "dial-in" : "" });
  if (b.balance != null) rows.push({ value: balText(b.balance), label: "balance", color: BCOL, kind: "dot" });
  const parts = [b.grind ? "grind " + b.grind : null, timeText(b), ratioOf(b) ? "1:" + r1(ratioOf(b)) : null].filter(Boolean).join(", ");
  if (parts) rows.push({ value: parts });
  if (nameOf(b.who)) rows.push({ value: nameOf(b.who), label: "made it" });
  return { title: fmtDate(b.t) + (c ? " · " + c.name : "") + (b.device ? " · " + b.device : ""), rows };
}

// ---------- 1 + 2: dial-in map and taste compass ----------
function viewDial() {
  let list = filtered(true);
  const c = coffeeOf(state.coffee);
  let devNote = "";
  if (!state.device && list.length) {   // one device at a time, otherwise grind and time are not comparable
    const counts = {}; list.forEach(b => { if (b.device) counts[b.device] = (counts[b.device] || 0) + 1; });
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    if (top && Object.keys(counts).length > 1) { list = list.filter(b => b.device === top); devNote = "Showing " + top + ", the device used most for this coffee. Pick another device above."; }
  }
  const dev = state.device || (list[0] && list[0].device) || "";
  const esp = isEsp(dev);

  const m = card("Dial-in map", "Grind setting against brew time. Each dot is a brew, darker means more stars. Look for the cluster of dark dots.");
  if (devNote) m.appendChild(el("p", "what", devNote));
  const pts = list.filter(b => numGrind(b.grind) !== null && b.time != null);
  if (pts.length < 2) empty(m, c ? "Log at least two brews of this coffee with a grind setting and a time to see the map." : "Pick a coffee above.");
  else {
    const box = chartBox(m);
    Charts.scatter({
      box, height: 300, xLabel: "Grind setting", xStep: 0.5, yLabel: esp ? "Time (s)" : "Time (min)", yFmt: esp ? null : v => mmss(v),   // grind marks every half step at the finest
      points: pts.map(b => ({ x: numGrind(b.grind), y: b.time, color: b.rating ? RCOL(b.rating) : "var(--mut)", hollow: !b.rating, r: b.dialin ? 4.5 : 5.5, tip: () => brewTip(b) }))
    });
    starRamp(m, pts.some(b => !b.rating));
    const best = pts.filter(b => b.rating).sort((a, b) => b.rating - a.rating || b.t - a.t)[0];
    if (best) m.appendChild(el("p", "take", "Best so far: grind " + best.grind + ", " + timeText(best) + (ratioOf(best) ? ", ratio 1:" + r1(ratioOf(best)) : "") + " (" + stars(best.rating) + ", " + fmtDate(best.t) + ")."));
    numbers(m, ["Date", "Grind", "Time", "Ratio", "Stars", "Balance", "Made by"], pts.slice().sort((a, b) => a.t - b.t).map(b => [fmtDate(b.t) + (b.dialin ? " (dial-in)" : ""), b.grind, timeText(b), ratioOf(b) ? "1:" + r1(ratioOf(b)) : null, b.rating ? stars(b.rating) : null, b.balance != null ? balText(b.balance) : null, nameOf(b.who)]));
  }

  // the brewing chart: extraction (sour to bitter) against strength (watery to heavy), each with its own fix
  const bc = card("Brewing chart", "Left is sour (underextracted), right is bitter (overextracted): change the grind, time or temperature. Down is watery, up is heavy: change the ratio. The box in the middle is where you want to be. The line follows your last eight brews, the ringed dot is the newest.");
  const bp = list.map(b => {
    const so = b.scores.sour, bi = b.scores.bitter, bo = b.scores.body;
    if ((so == null && bi == null) || bo == null) return null;
    const x = ((bi != null ? shown("bitter", bi) : 0) - (so != null ? shown("sour", so) : 0)) / (so != null && bi != null ? 2 : 1);
    return { b, x, y: shown("body", bo) };
  }).filter(Boolean).sort((a, b) => a.b.t - b.b.t);
  if (bp.length < 1) empty(bc, c ? "Rate sour or bitter and the new Body slider (when you rate a cup) to place brews here." : "Pick a coffee above.");
  else {
    const box = chartBox(bc);
    Charts.scatter({
      box, height: 320, xDomain: [-5, 5], xTicks: [-5, 0, 5], xFmt: v => v === 0 ? "just right" : v < 0 ? "sour" : "bitter", xGrid: true, xBase: 0,
      yDomain: [-5, 5], yTicks: [-5, 0, 5], yFmt: v => v === 0 ? "just right" : v < 0 ? "watery" : "heavy", yLabel: "Body", yBase: 0,
      zones: [{ x0: -1, x1: 1, y0: -1, y1: 1 }], corner: ["finer, more water", "coarser, more water", "finer, less water", "coarser, less water"],
      path: true, last: true, trailFrom: Math.max(0, bp.length - 8),
      points: bp.map((p, i) => ({ faded: i < bp.length - 8, x: p.x, y: p.y, color: p.b.rating ? RCOL(p.b.rating) : "var(--mut)", hollow: !p.b.rating, tip: () => brewTip(p.b, [{ value: p.x === 0 ? "just right" : (p.x < 0 ? "sour " : "bitter ") + r1(Math.abs(p.x)), label: "taste" }, { value: p.y === 0 ? "just right" : (p.y < 0 ? "watery " : "heavy ") + r1(Math.abs(p.y)), label: "body" }]) }))
    });
    starRamp(bc, bp.some(p => !p.b.rating));
    const L = bp[bp.length - 1], ex = Math.abs(L.x) <= 1 ? null : L.x < 0 ? "grind finer (or brew longer or hotter)" : "grind coarser (or brew shorter or cooler)", st = Math.abs(L.y) <= 1 ? null : L.y < 0 ? "use less water for the coffee (a shorter ratio)" : "use more water for the coffee (a longer ratio)";
    bc.appendChild(el("p", "take", !ex && !st ? "Your newest brew is in the box: neither sour nor bitter, and the body is right." : "Your newest brew is " + [L.x < -1 ? "sour" : L.x > 1 ? "bitter" : null, L.y < -1 ? "watery" : L.y > 1 ? "heavy" : null].filter(Boolean).join(" and ") + ". Next time: " + [ex, st].filter(Boolean).join(", and ") + "."));
    numbers(bc, ["Date", "Taste (sour - / bitter +)", "Body (watery - / heavy +)", "Ratio", "Stars"], bp.map(p => [fmtDate(p.b.t), r1(p.x), r1(p.y), ratioOf(p.b) ? "1:" + r1(ratioOf(p.b)) : null, p.b.rating ? stars(p.b.rating) : null]));
  }

  const k = card("Ratio and taste", "Your ratio against sour or bitter. Up is a shorter ratio (stronger), down a longer one. More water pulls a little more out of the coffee, so a sour cup often moves right with a longer ratio, especially with espresso. The line follows your last eight brews, the ringed dot is the newest.");
  const cp = list.map(b => {
    const so = b.scores.sour, bi = b.scores.bitter;
    if (so == null && bi == null) return null;
    const x = ((bi != null ? shown("bitter", bi) : 0) - (so != null ? shown("sour", so) : 0)) / (so != null && bi != null ? 2 : 1);
    const y = ratioOf(b);
    return y ? { b, x, y } : null;
  }).filter(Boolean).sort((a, b) => a.b.t - b.b.t);
  if (cp.length < 1) empty(k, c ? "Score sour or bitter and log dose and yield (or water) to place brews here." : "Pick a coffee above.");
  else {
    const box = chartBox(k), ys = cp.map(p => p.y);
    const lo = Math.min(...ys), hi = Math.max(...ys), padY = Math.max(0.2, (hi - lo) * 0.15);
    Charts.scatter({
      box, height: 320, xDomain: [-5, 5], xTicks: [-5, 0, 5], xFmt: v => v === 0 ? "just right" : v < 0 ? "sour" : "bitter", xGrid: true, xBase: 0,
      yDomain: [Math.max(0, lo - padY), hi + padY], yInvert: true, yFmt: v => "1:" + r1(v), yLabel: "Ratio (stronger at the top)",
      zones: [{ x0: -1, x1: 1 }], corner: ["shorter, sour", "shorter, bitter", "longer, sour", "longer, bitter"],
      path: true, last: true, trailFrom: Math.max(0, cp.length - 8),
      points: cp.map((p, i) => ({ faded: i < cp.length - 8, x: p.x, y: p.y, color: p.b.rating ? RCOL(p.b.rating) : "var(--mut)", hollow: !p.b.rating, tip: () => brewTip(p.b, [{ value: p.x === 0 ? "just right" : (p.x < 0 ? "sour " : "bitter ") + r1(Math.abs(p.x)), label: "taste" }]) }))
    });
    starRamp(k, cp.some(p => !p.b.rating));
    const lastP = cp[cp.length - 1];
    k.appendChild(el("p", "take", Math.abs(lastP.x) <= 1 ? "Your newest brew is in the middle: neither sour nor bitter." : lastP.x < 0 ? "Your newest brew leans sour: try finer, hotter or longer." : "Your newest brew leans bitter: try coarser, cooler or shorter."));
    numbers(k, ["Date", "Taste (sour - / bitter +)", "Ratio", "Stars"], cp.map(p => [fmtDate(p.b.t), r1(p.x), "1:" + r1(p.y), p.b.rating ? stars(p.b.rating) : null]));
  }
}

// ---------- 3: freshness curve ----------
function viewFresh() {
  const every = filtered(false).filter(b => b.rating && !b.dialin && b.dRoast != null && b.dRoast >= 0 && b.dRoast <= 75);
  const m = card("Freshness curve", "Stars against days after roast. Grey dots are single brews, the line is the average. Pick one coffee to see its own curve next to all coffees together.");
  if (every.length < 3) { empty(m, "Rate at least three brews of coffees with a roast date to see when they taste best."); return; }
  // one coffee or all of them
  const cnt = {}; every.forEach(b => { cnt[b.coffeeId] = (cnt[b.coffeeId] || 0) + 1; });
  const ids = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  if (state.freshC && !cnt[state.freshC]) state.freshC = "";
  if (ids.length > 1) {
    const sub = el("div", "subctl"), sel = el("select"); sel.setAttribute("aria-label", "Which coffee");
    [["", "All coffees together"]].concat(ids.map(id => { const c = coffeeOf(id); return [id, (c ? c.name : "Coffee") + (c && c.roast_date ? ", roasted " + fmtIso(c.roast_date) : "") + " · " + cnt[id]]; }))
      .forEach(([v, t]) => { const o = el("option", "", t); o.value = v; sel.appendChild(o); });
    sel.value = state.freshC; sel.onchange = () => { state.freshC = sel.value; render(); };
    sub.appendChild(sel); m.insertBefore(sub, m.querySelector(".what") ? m.querySelector(".what").nextSibling : null);
  }
  const one = state.freshC ? coffeeOf(state.freshC) : null, list = state.freshC ? every.filter(b => b.coffeeId === state.freshC) : every;
  const binLine = arr => { const bins = {}; arr.forEach(b => { const k = Math.floor(b.dRoast / 3) * 3; (bins[k] = bins[k] || []).push(b.rating); }); return Object.keys(bins).map(Number).sort((a, b) => a - b).map(k => ({ x: k + 1, y: r1(avg(bins[k])), n: bins[k].length })); };
  const line = binLine(list);
  const series = [{ name: one ? one.name : "Average", color: "var(--one)", points: line }];
  if (one && list.length < every.length) series.push({ name: "All coffees", color: "var(--mut)", points: binLine(every), dots: false, dash: true });
  if (series.length > 1) { const leg = el("div", "legend"); series.forEach(sr => legendItem(leg, sr.color, sr.name, sr.dash ? "dash" : "line")); m.appendChild(leg); }
  const box = chartBox(m);
  // a small, fixed vertical spread so brews with the same stars on the same day stay visible
  const jit = b => ((b.id.charCodeAt(0) + b.id.charCodeAt(b.id.length - 1)) % 5 - 2) * 0.06;
  Charts.lines({
    box, height: 300, xLabel: "Days after roast", yDomain: [0.5, 5.5], yTicks: [1, 2, 3, 4, 5], yFmt: v => v + "★",
    cloud: list.map(b => ({ x: b.dRoast, y: b.rating + jit(b) })),
    series,
    tipTitle: x => "Days " + (x - 1) + " to " + (x + 1) + " after roast",
    valueFmt: (sr, y, p) => y + "★ on average, " + p.n + (p.n === 1 ? " brew" : " brews")
  });
  const good = line.filter(p => p.n >= 2);
  const top = (good.length ? good : line).slice().sort((a, b) => b.y - a.y || b.n - a.n)[0];
  m.appendChild(el("p", "take", (one ? "So far " + one.name + " tastes best" : "So far your best brews come") + " around day " + (top.x - 1) + " to " + (top.x + 1) + " after roast (" + top.y + "★ on average)." + (good.length < 3 ? " This gets more reliable with more rated brews." : "")));
  numbers(m, ["Days after roast", "Average stars", "Brews"], line.map(p => [(p.x - 1) + " to " + (p.x + 1), p.y, p.n]));
}

// ---------- 4 + 5: what you like, flavour fingerprint ----------
function viewTaste() {
  const list = filtered(false).filter(b => b.rating && !b.dialin);

    ["Altitude", c => { const a = c.altitude_max_m != null ? (c.altitude_min_m + c.altitude_max_m) / 2 : c.altitude_min_m; if (a == null) return null; return a < 1200 ? "Below 1,200 m" : a < 1500 ? "1,200 to 1,500 m" : a < 1800 ? "1,500 to 1,800 m" : a < 2100 ? "1,800 to 2,100 m" : "2,100 m and up"; }]
  ];
  if (!list.length) empty(m, "Rate a few brews (outside dial-ins) to see what you like.");
  else {

    const tbl = [];
    groups.forEach(([title, key]) => {
      const by = {};
      list.forEach(b => { const c = coffeeOf(b.coffeeId); const k = c && key(c); if (k) (by[k] = by[k] || []).push(b.rating); });
      const rows = Object.keys(by).map(k => ({ label: k, value: avg(by[k]), n: by[k].length })).sort((a, b) => b.value - a.value);
      const cell = el("div"); grid.appendChild(cell); cell.appendChild(el("h3", "", title));
      if (!rows.length) { cell.appendChild(el("p", "small", "Not filled in on your coffees yet.")); return; }
      const box = chartBox(cell);
      Charts.hbars({ box, labelWidth: title === "Region" ? 150 : 112, domain: [0, 5], xTicks: [0, 1, 2, 3, 4, 5], color: "var(--one)", fmt: v => r1(v).toFixed(1) + "★",
        rows: rows.map(r => ({ label: r.label, value: r.value, sub: "(" + r.n + ")", tip: () => ({ title: title, rows: [{ value: r1(r.value).toFixed(1) + "★", label: r.label }, { value: String(r.n), label: r.n === 1 ? "rated brew" : "rated brews" }] }) })) });
      rows.forEach(r => tbl.push([title, r.label, r1(r.value).toFixed(1), r.n]));
    });
    numbers(m, ["Group", "Kind", "Average stars", "Brews"], tbl);
  }

  sweetSpot();
  const f = card("Flavour fingerprint", "The average sour, sweet and bitter of each coffee, from -5 to +5 (0 is just right), and its Balance from 0 to 5. Dial-in brews are left out of the Balance.");
  const scored = filtered(false).filter(b => CORE.some(a => b.scores[a] != null) || b.balance != null);
  const byC = {}; scored.forEach(b => (byC[b.coffeeId] = byC[b.coffeeId] || []).push(b));
  const ids = Object.keys(byC).sort((a, b) => byC[b].length - byC[a].length).slice(0, 6);
  if (!ids.length) { empty(f, "Score sour, sweet or bitter, or rate the Balance, on a few brews to see each coffee's fingerprint."); return; }
  const leg = el("div", "legend"); CORE.forEach(a => legendItem(leg, FCOL[a], a, "dot")); f.appendChild(leg);
  const grid = el("div", "grid2"); f.appendChild(grid);
  const tbl = [];
  ids.forEach(id => {
    const c = coffeeOf(id), bs = byC[id], cell = el("div"); grid.appendChild(cell);
    cell.appendChild(el("h3", "", c ? c.name : "Coffee"));
    cell.appendChild(el("p", "small", bs.length + (bs.length === 1 ? " scored brew" : " scored brews") + (c && c.roast_level ? ", " + c.roast_level.toLowerCase() + " roast" : "")));
    const vals = CORE.map(a => { const v = bs.map(b => b.scores[a]).filter(v => v != null).map(v => shown(a, v)); return { a, v: v.length ? avg(v) : null, n: v.length }; });
    const box = chartBox(cell);
    Charts.divbars({ box, compact: true, domain: [-5, 5], xTicks: [-5, 0, 5], xFmt: v => v > 0 ? "+" + v : String(v),
      rows: vals.map(x => ({ label: x.a, value: x.v, color: FCOL[x.a], tip: () => ({ title: c ? c.name : "", rows: [{ value: x.v === null ? "no score" : (x.v > 0 ? "+" : "") + r1(x.v), label: x.a + ", " + x.n + (x.n === 1 ? " brew" : " brews"), color: FCOL[x.a], kind: "dot" }] }) })) });
    const bal = avgBal(bs.filter(b => !b.dialin));
    cell.appendChild(balLine(bal));
    const notes = {}; bs.forEach(b => Object.keys(b.scores).forEach(a => { if (!SCALE.isCore(a) && SCALE.levelOf(b.scores[a]) === 2) notes[a] = (notes[a] || 0) + 1; }));
    const top = Object.keys(notes).sort((a, b) => notes[b] - notes[a]).slice(0, 3);
    if (top.length) cell.appendChild(el("p", "small", "Clearly there: " + top.map(a => a + (notes[a] > 1 ? " (" + notes[a] + "×)" : "")).join(", ")));
    tbl.push([c ? c.name : "", ...vals.map(x => x.v === null ? null : r1(x.v)), bal ? balText(bal.v) : null, bs.length]);
  });
  numbers(f, ["Coffee", ...CORE, "Balance", "Brews"], tbl);
}

// Balance as a small 0..5 meter with its words, or "not rated yet"
function balLine(b, label) {
  const p = el("div", "balm");
  if (!b) { p.appendChild(el("span", "small", (label ? label + ": " : "") + "Balance not rated yet")); return p; }
  const tr = el("span", "tr"), fl = el("span", "fl"); fl.style.width = (b.v / 5 * 100) + "%"; tr.appendChild(fl);
  p.append(el("span", "bl", (label ? label + ": " : "") + "Balance"), tr, el("b", "", balText(b.v)));
  p.title = SCALE.balanceName(b.v) + ", from " + b.n + (b.n === 1 ? " rating" : " ratings");
  p.appendChild(el("span", "small", SCALE.balanceName(b.v).toLowerCase() + " · " + b.n + (b.n === 1 ? " brew" : " brews")));
  return p;
}
// Your sweet spot: how the brews you liked most taste, next to the others (and which tasting notes they have)
function sweetSpot() {
  const sc = filtered(false).filter(b => b.rating && !b.dialin && (CORE.some(a => b.scores[a] != null) || b.balance != null));
  const who = state.rater && state.rater !== GUEST ? state.names[state.rater] : null;
  const f = card("Your sweet spot", "Where the brews you liked most sit: their average sour, sweet and bitter (4 stars and up) and their Balance, next to the rest, and their most common tasting notes." + (who ? " Only " + who + "'s ratings." : $("f-rater").hidden ? "" : " Pick someone under \"Rated by\" to see one person's taste."));
  if (sc.length < 3) { empty(f, "Rate and score the taste of at least three brews to find your sweet spot."); return; }
  let fav = sc.filter(b => b.rating >= 4), favLabel = "4★ and up";
  if (fav.length < 2 || fav.length === sc.length) {   // few 4-star brews, or only 4-star brews: the best third instead
    const sorted = sc.slice().sort((a, b) => b.rating - a.rating), n = Math.max(1, Math.ceil(sc.length / 3)), cut = sorted[n - 1].rating;
    fav = sc.filter(b => b.rating >= cut && b.rating > Math.min(...sc.map(x => x.rating))); if (!fav.length) fav = sorted.slice(0, n);
    favLabel = "your best rated, " + stars(cut) + " and up";
  }
  const rest = sc.filter(b => !fav.includes(b));
  const prof = arr => CORE.map(a => { const v = arr.map(b => b.scores[a]).filter(v => v != null).map(v => shown(a, v)); return { a, v: v.length ? avg(v) : null, n: v.length }; });
  const pf = prof(fav), pr = prof(rest);
  const leg = el("div", "legend"); CORE.forEach(a => legendItem(leg, FCOL[a], a, "dot")); f.appendChild(leg);
  const grid = el("div", "grid2"); f.appendChild(grid);
  const bars = (title, sub, vals) => {
    const cell = el("div"); grid.appendChild(cell); cell.appendChild(el("h3", "", title)); cell.appendChild(el("p", "small", sub));
    Charts.divbars({ box: chartBox(cell), compact: true, domain: [-5, 5], xTicks: [-5, 0, 5], xFmt: v => v > 0 ? "+" + v : String(v),
      rows: vals.map(x => ({ label: x.a, value: x.v, color: FCOL[x.a], tip: () => ({ title, rows: [{ value: x.v === null ? "no score" : (x.v > 0 ? "+" : "") + r1(x.v), label: x.a + ", " + x.n + (x.n === 1 ? " brew" : " brews"), color: FCOL[x.a], kind: "dot" }] }) })) });
  };
  bars("Your favourites", fav.length + (fav.length === 1 ? " brew, " : " brews, ") + favLabel, pf);
  grid.lastChild.appendChild(balLine(avgBal(fav)));
  if (rest.length) { bars("The others", rest.length + (rest.length === 1 ? " brew" : " brews"), pr); grid.lastChild.appendChild(balLine(avgBal(rest))); }
  // in words: where the favourites sit
  const W = { sour: ["more sour", "less sour", "sourness"], sweet: ["sweeter", "less sweet", "sweetness"], bitter: ["more bitter", "less bitter", "bitterness"] };
  const lean = [], right = [];
  pf.forEach(x => { if (!W[x.a] || x.v === null) return; const d = Math.abs(x.v); if (d < 0.75) right.push(W[x.a][2]); else lean.push((d > 2 ? "clearly " : "a little ") + W[x.a][x.v > 0 ? 0 : 1]); });
  let txt = !lean.length && !right.length ? "" : !lean.length ? "Your favourites sit right in the middle: " + andList(right) + " just right." :
    "Your favourites are " + andList(lean) + " than just right" + (right.length ? ", with " + andList(right) + " just right." : ".");
  const diff = pf.map((x, i) => ({ a: x.a, f: x.v, r: pr[i].v })).filter(x => x.f !== null && x.r !== null).sort((x, y) => Math.abs(y.f - y.r) - Math.abs(x.f - x.r))[0];
  const sg = v => (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(r1(v));
  if (diff && Math.abs(diff.f - diff.r) >= 0.75) txt += " The biggest difference to your other brews is " + diff.a + ": " + sg(diff.f) + " against " + sg(diff.r) + ".";
  const bf = avgBal(fav), br = avgBal(rest);
  if (bf && br && Math.abs(bf.v - br.v) >= 0.5) txt += " Your favourites are also " + (bf.v > br.v ? "better" : "less") + " balanced: " + balText(bf.v) + " against " + balText(br.v) + ".";
  else if (bf && !br) txt += " Their Balance: " + balText(bf.v) + ", " + SCALE.balanceName(bf.v).toLowerCase() + ".";
  if (txt) f.appendChild(el("p", "take", txt));
  // tasting notes: how often they are there in the favourites (and in the others)
  const notes = {}, cnt = (arr, k) => arr.forEach(b => Object.keys(b.scores).forEach(a => { if (!SCALE.isCore(a) && SCALE.levelOf(b.scores[a]) >= 1) { notes[a] = notes[a] || { f: 0, r: 0 }; notes[a][k]++; } }));
  cnt(fav, "f"); cnt(rest, "r");
  const top = Object.keys(notes).filter(a => notes[a].f).sort((a, b) => notes[b].f - notes[a].f || notes[a].r - notes[b].r).slice(0, 5);
  if (top.length) f.appendChild(el("p", "small", "Tasting notes in your favourites: " + top.map(a => a + " (" + notes[a].f + " of " + fav.length + (rest.length ? ", in the others " + notes[a].r + " of " + rest.length : "") + ")").join(", ") + "."));
  const bv = l => { const b = avgBal(l); return b ? balText(b.v) : null; };
  numbers(f, ["", ...CORE, "Balance", "Brews"], [["Favourites", ...pf.map(x => x.v === null ? null : r1(x.v)), bv(fav), fav.length]].concat(rest.length ? [["The others", ...pr.map(x => x.v === null ? null : r1(x.v)), bv(rest), rest.length]] : []));
}

// ---------- 6 + 7 + 8: us ----------
function viewUs() {
  const list = filtered(false), ppl = people().filter(id => list.some(b => b.who === id));
  const s = card("Who brews", "Brews per person, and the average stars their brews got from whoever tasted them. Dial-in brews count as brews, not for the stars.");
  if (!ppl.length) empty(s, "Brews show up here once they have a \"Made by\".");
  else {
    const tiles = el("div", "tiles"); s.appendChild(tiles);
    ppl.forEach(id => {
      const mine = list.filter(b => b.who === id), rated = mine.filter(b => b.rating && !b.dialin), t = el("div", "tile");
      const l = el("div", "tl"), i = el("i"); i.style.setProperty("--col", personCol(id)); l.append(i, document.createTextNode(nameOf(id)));
      const gave = list.reduce((x, b) => x + b.ratings.filter(r => !r.guest && r.who === id && r.rating != null).length, 0);
      t.appendChild(l); t.appendChild(el("div", "tv", String(mine.length))); t.appendChild(el("div", "ts", (mine.length === 1 ? "brew" : "brews") + (rated.length ? ", " + r1(avg(rated.map(b => b.rating))).toFixed(1) + "★ on average" : "") + (gave ? ". Rated " + gave + (gave === 1 ? " brew" : " brews") : "")));
      tiles.appendChild(t);
    });
  }

  // who gives which stars: by the person who rated, whoever made the brew
  const raters = people().filter(id => list.some(b => b.ratings.some(r => !r.guest && r.who === id && r.rating != null)));
  const v = card("Birte vs Andres", "The stars each of you gives, per coffee. Only coffees you have both rated, whoever brewed them.");
  if (raters.length < 2) empty(v, "Needs ratings from two people.");
  else {
    const rp = raters.slice(0, 2);
    v.querySelector("h2").textContent = nameOf(rp[0]) + " vs " + nameOf(rp[1]);
    const by = {};
    list.filter(b => !b.dialin).forEach(b => b.ratings.forEach(r => { if (r.guest || r.rating == null || (r.who !== rp[0] && r.who !== rp[1])) return; const k = b.coffeeId; by[k] = by[k] || { a: [], b: [] }; by[k][r.who === rp[0] ? "a" : "b"].push(r.rating); }));
    const rows = Object.keys(by).filter(k => by[k].a.length && by[k].b.length).map(k => ({ c: coffeeOf(k), a: avg(by[k].a), b: avg(by[k].b), na: by[k].a.length, nb: by[k].b.length }));
    const leg = el("div", "legend"); legendItem(leg, "var(--p1)", nameOf(rp[0]), "dot"); legendItem(leg, "var(--p2)", nameOf(rp[1]), "dot"); v.appendChild(leg);
    if (!rows.length) empty(v, "No coffee rated by both of you yet.");
    else {
      const box = chartBox(v);
      Charts.dumbbell({ box, domain: [1, 5], colors: ["var(--p1)", "var(--p2)"], fmt: x => x + "★",
        rows: rows.map(r => ({ label: r.c ? r.c.name : "Coffee", a: r.a, b: r.b, tip: () => ({ title: r.c ? r.c.name : "", rows: [{ value: r1(r.a).toFixed(1) + "★", label: nameOf(rp[0]) + ", " + r.na + " brews", color: "var(--p1)", kind: "dot" }, { value: r1(r.b).toFixed(1) + "★", label: nameOf(rp[1]) + ", " + r.nb + " brews", color: "var(--p2)", kind: "dot" }] }) })) });
      const diff = avg(rows.map(r => r.a - r.b));
      v.appendChild(el("p", "take", Math.abs(diff) < 0.25 ? "You rate the same coffees about the same." : (diff > 0 ? nameOf(rp[0]) : nameOf(rp[1])) + " rates the same coffees " + r1(Math.abs(diff)).toFixed(1) + "★ higher on average."));
      numbers(v, ["Coffee", nameOf(rp[0]), nameOf(rp[1])], rows.map(r => [r.c ? r.c.name : "", r1(r.a).toFixed(1), r1(r.b).toFixed(1)]));
    }
  }

  const a = card("Activity", "Brews per week over the last 12 weeks, and which devices you use.");
  if (!list.length) empty(a, "No brews yet.");
  else {
    const now = new Date(), monday = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
    const start = monday(now); start.setDate(start.getDate() - 7 * 11);
    const weeks = []; for (let i = 0; i < 12; i++) { const w = new Date(start); w.setDate(start.getDate() + 7 * i); weeks.push(w); }
    const who = [...ppl, ""], cols = weeks.map(w => {
      const end = new Date(w); end.setDate(w.getDate() + 7);
      const inW = list.filter(b => b.t >= w && b.t < end);
      return { label: fmtShort(w), full: fmtDate(w), parts: who.map(id => ({ value: inW.filter(b => (b.who || "") === id && (id || !ppl.includes(b.who))).length, color: id ? personCol(id) : "var(--mut)", name: id ? nameOf(id) : "not set" })), n: inW.length, w };
    });
    const leg = el("div", "legend"); ppl.forEach(id => legendItem(leg, personCol(id), nameOf(id), "dot")); if (list.some(b => !ppl.includes(b.who))) legendItem(leg, "var(--mut)", "not set", "dot"); a.appendChild(leg);
    const box = chartBox(a);
    Charts.stacked({ box, height: 210, yLabel: "Brews", cols: cols.map(c => ({ label: c.label, parts: c.parts, tip: () => ({ title: "Week of " + c.full, rows: [{ value: String(c.n), label: c.n === 1 ? "brew" : "brews" }].concat(c.parts.filter(p => p.value).map(p => ({ value: String(p.value), label: p.name, color: p.color, kind: "dot" }))) }) })) });
    const dc = {}; list.forEach(b => { const k = b.device || "Unknown"; dc[k] = (dc[k] || 0) + 1; });
    const drows = Object.keys(dc).map(k => ({ label: k, value: dc[k] })).sort((x, y) => y.value - x.value);
    a.appendChild(el("h3", "", "Devices"));
    const box2 = chartBox(a);
    Charts.hbars({ box: box2, color: "var(--one)", fmt: v => String(v), rows: drows.map(r => ({ label: r.label, value: r.value, tip: () => ({ title: r.label, rows: [{ value: String(r.value), label: r.value === 1 ? "brew" : "brews" }] }) })) });
    numbers(a, ["Week of", ...ppl.map(nameOf), "Total"], cols.map(c => [c.full, ...ppl.map((id, i) => c.parts[i].value), c.n]));
  }

  const bl = card("Beans left", "Open bags with a bag size: grams used by the brews logged so far.");
  const bags = state.coffees.filter(c => !c.archived && !c.finished_at && c.bag_g && c.open_date);
  if (!bags.length) empty(bl, "Add the bag size (in grams) to an opened coffee on the Coffee Shelf to see how much is left.");
  else bags.forEach(c => {
    const mine = state.brews.filter(b => b.coffeeId === c.id), used = mine.reduce((x, b) => x + (b.dose || 0), 0);
    const left = Math.max(0, c.bag_g - used), doses = mine.map(b => b.dose).filter(Boolean).sort((x, y) => x - y);
    const typical = doses.length ? doses[Math.floor(doses.length / 2)] : 18;
    const m = el("div", "meter"), top = el("div", "mt");
    top.append(el("b", "", c.name), el("span", "", Math.round(left) + " g left"));
    const tr = el("div", "tr"), fl = el("div", "fl"); fl.style.width = Math.min(100, left / c.bag_g * 100) + "%"; tr.appendChild(fl);
    tr.setAttribute("role", "img"); tr.setAttribute("aria-label", Math.round(left) + " of " + c.bag_g + " grams left");
    m.append(top, tr, el("p", "ms", Math.round(used) + " of " + c.bag_g + " g used in " + mine.length + (mine.length === 1 ? " brew" : " brews") + (left > 0 ? ", about " + Math.floor(left / typical) + " more at " + typical + " g" : "")));
    bl.appendChild(m);
  });
}

// ---------- over time (the original chart, redrawn) ----------
function viewTime() {
  const c = coffeeOf(state.coffee);
  const m = card("Flavour over time", "Sour, sweet and bitter for one coffee, from -5 to +5, and below it the Balance from 0 to 5. Lines only join brews of one recipe, so a recipe change is not mistaken for the coffee changing.");
  if (!c) { empty(m, "Pick a coffee above."); return; }
  const xk = state.xk, all = filtered(true).map(b => ({ b, x: xk === "roast" ? b.dRoast : b.dOpen })).filter(p => p.x != null && (CORE.some(a => p.b.scores[a] != null) || p.b.balance != null));
  const counts = {}; all.forEach(p => { const r = p.b.recipe || "(no recipe name)"; counts[r] = (counts[r] || 0) + 1; });
  const recipes = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (state.recipe && !recipes.includes(state.recipe)) state.recipe = "";
  if (!state.recipe && recipes.length) state.recipe = recipes[0];
  const sub = el("div", "subctl"); m.appendChild(sub);
  const rs = el("select"); rs.setAttribute("aria-label", "Recipe");
  [["", "All recipes (dots only)"], ...recipes.map(r => [r, r + " (" + counts[r] + ")"])].forEach(([v, t]) => { const o = el("option", "", t); o.value = v; rs.appendChild(o); });
  rs.value = state.recipe; rs.onchange = () => { state.recipe = rs.value; render(); }; sub.appendChild(rs);
  const xs = el("select"); xs.setAttribute("aria-label", "Count days from");
  [["roast", "Days after roast"], ["open", "Days after opening"]].forEach(([v, t]) => { const o = el("option", "", t); o.value = v; xs.appendChild(o); });
  xs.value = xk; xs.onchange = () => { state.xk = xs.value; render(); }; sub.appendChild(xs);
  if (!all.length) { empty(m, (xk === "roast" ? !c.roast_date : !c.open_date) ? "This coffee has no " + (xk === "roast" ? "roast" : "opening") + " date yet. Add it on the Coffee Shelf, or count from the other date." : "No scored brews for this coffee yet."); return; }
  const use = all.filter(p => !state.recipe || (p.b.recipe || "(no recipe name)") === state.recipe);
  const leg = el("div", "legend"); m.appendChild(leg);
  CORE.forEach(a => legendItem(leg, FCOL[a], a, "line", () => { if (state.hidden.has(a)) state.hidden.delete(a); else state.hidden.add(a); render(); }, !state.hidden.has(a)));
  const series = CORE.filter(a => !state.hidden.has(a)).map(a => {
    const by = {}; use.forEach(p => { if (p.b.scores[a] != null) (by[r1(p.x)] = by[r1(p.x)] || []).push(shown(a, p.b.scores[a])); });
    return { name: a, color: FCOL[a], points: Object.keys(by).map(Number).map(x => ({ x, y: r1(avg(by[x])) })), dots: true };
  });
  const box = chartBox(m);
  if (!state.recipe) series.forEach(s => { s.points.sort((p, q) => p.x - q.x); });
  Charts.lines({ box, height: 300, xLabel: xk === "roast" ? "Days after roast" : "Days after opening", yDomain: [-5, 5], yTicks: [-5, 0, 5], yBase: 0, yFmt: v => v > 0 ? "+" + v : String(v),
    series: state.recipe ? series : series.map(s => Object.assign({}, s, { points: s.points })), labelEnds: false,   // the legend names the lines; labels at the line ends only got in each other's way
    tipTitle: x => "Day " + x, valueFmt: (s, y) => (y > 0 ? "+" : "") + y });
  if (!state.recipe) box.querySelectorAll(".ln").forEach(l => l.remove());
  // Balance: its own small chart, 0 to 5 (dial-in brews are shown too, as hollow dots, but not in the line)
  const bu = use.filter(p => p.b.balance != null);
  if (bu.length) {
    m.appendChild(el("h3", "", "Balance")).style.cssText = "font-size:15px;margin:16px 0 0";
    const by = {}; bu.filter(p => !p.b.dialin).forEach(p => (by[r1(p.x)] = by[r1(p.x)] || []).push(p.b.balance));
    const bx = chartBox(m);
    Charts.lines({ box: bx, height: 170, xLabel: xk === "roast" ? "Days after roast" : "Days after opening", yDomain: [0, 5], yTicks: [0, 1, 2, 3, 4, 5],
      cloud: bu.filter(p => p.b.dialin).map(p => ({ x: p.x, y: p.b.balance })),
      series: [{ name: "Balance", color: BCOL, points: Object.keys(by).map(Number).map(x => ({ x, y: r1(avg(by[x])) })), dots: true }],
      tipTitle: x => "Day " + x, valueFmt: (sr, y) => y + "/5 · " + SCALE.balanceName(y).toLowerCase() });
    if (!state.recipe) bx.querySelectorAll(".ln").forEach(l => l.remove());
    if (bu.some(p => p.b.dialin)) m.appendChild(el("p", "small", "Grey dots: dial-in brews, not in the line."));
  }
  m.appendChild(el("p", "take", use.length < 3 ? "Only " + use.length + " scored brew" + (use.length === 1 ? "" : "s") + " here. A trend needs at least three brews of the same recipe over a few weeks." : "Each point is the average of the brews on that day."));
  numbers(m, ["Day", "Recipe", ...CORE, "Balance"], use.slice().sort((p, q) => p.x - q.x).map(p => [r1(p.x) + (p.b.dialin ? " (dial-in)" : ""), p.b.recipe, ...CORE.map(a => p.b.scores[a] != null ? SCALE.text(a, p.b.scores[a]) : null), p.b.balance != null ? balText(p.b.balance) : null]));
}

// ---------- render ----------
const VIEWS = { time: viewTime, dial: viewDial, fresh: viewFresh, taste: viewTaste, us: viewUs };
function render() {
  Charts.hideTip();
  document.querySelectorAll(".tabs .tab").forEach(t => { const on = t.dataset.v === state.view; t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1; });
  $("f-coffee").hidden = !(state.view === "time" || state.view === "dial");
  $("banner").hidden = !state.demo;
  $("views").textContent = "";
  if (!state.demo && !state.signedIn) { const c = card("Sign in first", null); empty(c, "Sign in on the Coffee Shelf, then come back here. Until then, tap \"Example data\" to see how the charts look."); return; }
  if (!state.brews.length) { const c = card("No brews yet", null); empty(c, "Log a few brews on the Coffee Shelf and the charts appear here. Tap \"Example data\" to see how they will look."); return; }
  VIEWS[state.view]();
}
function fillFilters() {
  const fill = (id, first, items, keep) => {
    const s = $(id); s.textContent = "";
    const o = el("option", "", first); o.value = ""; s.appendChild(o);
    items.forEach(([v, t]) => { const x = el("option", "", t); x.value = v; s.appendChild(x); });
    s.value = items.some(i => i[0] === keep) ? keep : "";
    return s.value;
  };
  const counts = {}; state.brews.forEach(b => { counts[b.coffeeId] = (counts[b.coffeeId] || 0) + 1; });
  const cs = state.coffees.filter(c => counts[c.id]).sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
  if (!state.coffee || !counts[state.coffee]) state.coffee = cs.length ? cs[0].id : "";
  const csel = $("f-coffee"); csel.textContent = "";
  cs.forEach(c => { const o = el("option", "", c.name + (c.roast_date ? ", roasted " + fmtIso(c.roast_date) : "") + (c.archived ? " (archived)" : "") + " · " + counts[c.id]); o.value = c.id; csel.appendChild(o); });
  if (!cs.length) { const o = el("option", "", "No coffees with brews"); o.value = ""; csel.appendChild(o); }
  csel.value = state.coffee;
  const devs = [...new Set(state.brews.map(b => b.device).filter(Boolean))].sort();
  state.device = fill("f-device", "All devices", devs.map(d => [d, d]), state.device);
  const ppl = people().filter(id => state.brews.some(b => b.who === id));
  state.who = fill("f-who", "Made by anyone", ppl.map(id => [id, "Made by " + state.names[id]]), state.who);
  $("f-who").hidden = ppl.length < 2;
  // rated by: everyone who rated something, and guests
  const rated = people().filter(id => state.brews.some(b => b.ratings.some(r => !r.guest && r.who === id)));
  const guests = state.brews.some(b => b.ratings.some(r => r.guest));
  state.rater = fill("f-rater", "Rated by anyone", rated.map(id => [id, "Rated by " + state.names[id]]).concat(guests ? [[GUEST, "Rated by guests"]] : []), state.rater);
  $("f-rater").hidden = rated.length + (guests ? 1 : 0) < 2;
}

// ---------- data ----------
function shape(raw, coffees) {
  return raw.map(b => {
    const t = new Date(b.brewed_at), c = coffees.find(x => x.id === b.coffee_id), scores = {};
    (b.brew_scores || []).forEach(x => { scores[x.attribute] = x.score; });
    // everyone who rated it (supabase/19_brew_ratings.sql); a brew from before: one rating, by whoever made it
    const sco = id => { const o = {}; (b.brew_scores || []).filter(x => x.rating_id === id).forEach(x => { o[x.attribute] = x.score; }); return o; };
    const ratings = (b.brew_ratings || []).length
      ? b.brew_ratings.map(r => ({ who: r.is_guest ? null : r.rater_id, guest: !!r.is_guest, name: r.guest_name || null, rating: r.rating == null ? null : Number(r.rating), balance: r.balance == null ? null : Number(r.balance), scores: sco(r.id) }))
      : (b.rating != null || (b.brew_scores || []).length ? [{ who: b.made_by || b.created_by || null, guest: false, name: null, rating: b.rating == null ? null : Number(b.rating), balance: null, scores }] : []);
    const day = iso => iso ? Math.floor((t - new Date(iso + "T00:00:00")) / 864e5) : null;
    return { id: b.id, coffeeId: b.coffee_id, t, device: b.device, grind: b.grind, dose: b.dose_g, yld: b.yield_g, water: b.water_g, time: b.time_s,
      rating: b.rating == null ? null : Number(b.rating), dialin: !!b.is_dialin, recipe: b.recipe, who: b.made_by || b.created_by || null, ratings, scores, dRoast: c ? day(c.roast_date) : null, dOpen: c ? day(c.open_date) : null };
  });
}
async function loadMine() {
  $("msg").textContent = "Loading...";
  // the household chosen in the Journal (after supabase/15_households.sql); before that, everything you can see
  let hh = null;
  const hm = await db.from("household_members").select("household_id").eq("user_id", state.me.id);
  if (!hm.error && hm.data.length) { const saved = store.get("alto.household"); hh = (hm.data.find(x => x.household_id === saved) || hm.data[0]).household_id; }
  const cq = db.from("coffees").select("*");
  const [cs, bs, ps] = await Promise.all([
    (hh ? cq.eq("household_id", hh) : cq).order("created_at", { ascending: false }),
    db.from("brews").select("*, brew_ratings(id,rater_id,is_guest,guest_name,rating,balance), brew_scores(attribute,score,rating_id)").order("brewed_at"),
    db.from("profiles").select("id,display_name")
  ]);
  $("msg").textContent = "";
  if (cs.error || bs.error) { $("msg").textContent = "Could not load: " + (cs.error || bs.error).message; return; }
  state.coffees = cs.data.map(c => Object.assign({}, c, { bag_g: c.bag_size_g || null }));
  state.names = {}; (ps.data || []).forEach(p => { state.names[p.id] = p.display_name; });
  const ids = new Set(state.coffees.map(c => c.id));
  state.brews = shape(bs.data.filter(b => ids.has(b.coffee_id)), state.coffees);
  fillFilters(); render();
}

// Example data: made up, only to show how the charts look.
function demo() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const day = n => { const d = new Date(); d.setHours(8, 0, 0, 0); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  const coffees = [
    { id: "d1", name: "Colombia Huila", origin: "Colombia, Huila", process: "Washed", roast_level: "Light", altitude_min_m: 1700, altitude_max_m: 1900, roast_date: day(40), open_date: day(34), bag_size_g: 250 },
    { id: "d2", name: "Ethiopia Guji", origin: "Ethiopia, Guji", process: "Natural", roast_level: "Medium-light", altitude_min_m: 2000, altitude_max_m: 2200, roast_date: day(30), open_date: day(22), bag_size_g: 250 },
    { id: "d3", name: "Brazil Cerrado", origin: "Brazil, Cerrado", process: "Pulped natural", roast_level: "Medium-dark", altitude_min_m: 1100, roast_date: day(55), open_date: day(48), archived: false }
  ];
  const brews = []; let n = 0;
  coffees.forEach((c, ci) => {
    const roast = Math.round((Date.now() - new Date(c.roast_date + "T00:00:00")) / 864e5), opened = Math.round((Date.now() - new Date(c.open_date + "T00:00:00")) / 864e5);
    for (let d = opened; d >= 0; d -= 1 + Math.floor(rnd() * 3)) {
      const flair = rnd() < 0.72, age = roast - d, who = rnd() < 0.55 ? "pa" : "pb";
      const grind = flair ? 18 + Math.floor(rnd() * 12) : 55 + Math.floor(rnd() * 25);
      const time = flair ? Math.round(20 + (30 - grind) * 2.6 + rnd() * 10) : Math.round(150 + (80 - grind) * 2 + rnd() * 30);
      const ext = flair ? (time - 42) / 6 : (time - 200) / 25;   // + is over, - is under
      const fresh = -Math.abs(age - 14) / 9;
      const rating = Math.max(1, Math.min(5, Math.round(4.2 - Math.abs(ext) * 0.7 + fresh + (who === "pa" ? 0.2 : -0.2) + (ci === 1 ? 0.3 : 0) + (rnd() - 0.5))));
      const dose = flair ? 18 : 30, yld = flair ? Math.round(36 + rnd() * 12) : 440, water = flair ? null : 500;
      const sc = (v) => Math.max(0, Math.min(10, Math.round(v)));
      brews.push({ id: "b" + (++n) + "x", coffee_id: c.id, brewed_at: new Date(Date.now() - d * 864e5 - rnd() * 3e6).toISOString(), device: flair ? "Manual espresso machine" : "Hario V60",
        grind: String(grind), dose_g: dose, yield_g: yld, water_g: water, time_s: time, rating: rnd() < 0.9 ? rating : null, is_dialin: rnd() < 0.15, made_by: who, recipe: flair ? "Manual espresso, 1:2.2" : "V60, 60 g/l",
        brew_scores: [{ attribute: "sour", score: sc(5 - ext * 1.6 + (rnd() - 0.5) * 2) }, { attribute: "sweet", score: sc(5 + (ci === 1 ? 2 : 1) - Math.abs(ext) + rnd()) }, { attribute: "bitter", score: sc(5 + ext * 1.6 + (ci === 2 ? 1.5 : 0) + (rnd() - 0.5) * 2) }].concat(rnd() < 0.7 ? [{ attribute: "body", score: sc(5 + (rnd() - 0.5) * 5 + ext * 0.6) }] : [])
          .concat(ci === 1 ? [{ attribute: "blueberry", score: rnd() < 0.6 ? 7 : 3 }] : ci === 0 ? [{ attribute: "panela", score: rnd() < 0.5 ? 7 : 3 }] : [{ attribute: "nutty", score: 7 }]) });
    }
  });
  // who tasted it: mostly whoever made it, sometimes both of you, now and then a guest
  brews.forEach((b, i) => {
    const other = b.made_by === "pa" ? "pb" : "pa", rid = k => b.id + k, cl = v => Math.max(1, Math.min(5, Math.round(v * 2) / 2));
    const own = rnd() < 0.3 ? other : b.made_by;   // brewed for the other one
    const ext = b.is_dialin ? 1.5 : Math.abs((b.brew_scores[2].score - b.brew_scores[0].score) / 4), bl = v => Math.max(0, Math.min(5, Math.round(v)));
    b.brew_ratings = [{ id: rid("a"), rater_id: own, is_guest: false, guest_name: null, rating: b.rating, balance: rnd() < 0.85 ? bl(4.3 - ext + (rnd() - 0.5)) : null }];
    b.brew_scores.forEach(x => { x.rating_id = rid("a"); });
    if (b.rating != null && rnd() < 0.3) {
      const r2 = cl(b.rating + (own === "pa" ? -0.5 : 0.5) + (rnd() - 0.5));
      b.brew_ratings.push({ id: rid("b"), rater_id: own === "pa" ? "pb" : "pa", is_guest: false, guest_name: null, rating: r2, balance: bl(4 - ext + (rnd() - 0.5) * 1.5) });
      b.brew_scores = b.brew_scores.concat(b.brew_scores.filter(x => SCALE.isCore(x.attribute)).map(x => ({ attribute: x.attribute, score: Math.max(0, Math.min(10, x.score + Math.round((rnd() - 0.5) * 3))), rating_id: rid("b") })));
    }
    if (b.rating != null && rnd() < 0.07) b.brew_ratings.push({ id: rid("g"), rater_id: null, is_guest: true, guest_name: rnd() < 0.5 ? "Lena" : null, rating: cl(b.rating + 0.5) });
  });
  return { coffees, brews, names: { pa: "Birte (example)", pb: "Andres (example)" } };
}
function enterDemo() {
  const d = demo(); state.demo = true;
  state.coffees = d.coffees.map(c => Object.assign({}, c, { bag_g: c.bag_size_g || null })); state.names = d.names; state.brews = shape(d.brews, state.coffees);
  state.coffee = ""; state.device = ""; state.who = ""; state.rater = "";
  $("f-demo").textContent = "Back to my data"; fillFilters(); render();
}
function leaveDemo() {
  state.demo = false; state.coffees = []; state.brews = []; state.names = {}; state.coffee = ""; state.device = ""; state.who = ""; state.rater = "";
  $("f-demo").textContent = "Example data";
  if (state.signedIn) loadMine(); else { fillFilters(); render(); }
}

// ---------- events ----------
const saved = store.get("alto.trends.view"); if (VIEWS[saved]) state.view = saved;
document.querySelectorAll(".tabs .tab").forEach(t => { t.onclick = () => { state.view = t.dataset.v; store.set("alto.trends.view", state.view); render(); }; });

$("f-rater").onchange = () => { state.rater = $("f-rater").value; render(); };
$("f-demo").onclick = () => state.demo ? leaveDemo() : enterDemo();
let rz = null; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.brews.length) render(); }, 200); });

fillFilters(); render();
db.auth.onAuthStateChange((_e, session) => setTimeout(() => {
  const was = state.signedIn; state.signedIn = !!session; state.me = session ? session.user : null;
  if (state.demo) return;
  if (session && !was) loadMine(); else if (!session) { state.coffees = []; state.brews = []; fillFilters(); render(); }
}, 0));
