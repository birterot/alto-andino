<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alto Andino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Trends | Alto Andino</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Chart colours. Flavours and people use a colour set that was checked for colour blindness and contrast
   (flavours: sour, sweet, bitter, balance in this fixed order; people: first and second person).
   Star ratings use one coffee-brown scale, light to dark (1 to 5 stars). */
:root{
  --f-sour:light-dark(#2a78d6,#3987e5);--f-sweet:light-dark(#eb6834,#d95926);--f-bitter:light-dark(#1baf7a,#199e70);--f-balance:light-dark(#eda100,#c98500);
  --p1:light-dark(#2a78d6,#3987e5);--p2:light-dark(#eb6834,#d95926);
  --r1:light-dark(#C29F72,#7D5A3B);--r2:light-dark(#AA8253,#9A7650);--r3:light-dark(#8C653A,#B8936A);--r4:light-dark(#6C4A28,#D3B08A);--r5:light-dark(#4C3118,#EBD2B0);
  --one:light-dark(#8A6A4A,#C4A27C);--one-track:light-dark(#E9DFD2,#3A332C);
  --grid:light-dark(#E6E0D6,#34302B);--axis:light-dark(#C9C0B2,#4A443D)
}
.tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:none;margin:16px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{flex:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.ctl select,.ctl button{font:inherit;font-size:14.5px;min-height:42px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background-color:var(--card);min-width:0;flex:1 1 150px;max-width:100%}
#f-coffee{flex-basis:100%}
.ctl button{flex:0 0 auto;padding:0 16px;cursor:pointer;color:var(--mut)}
ul.rank{list-style:none;margin:6px 0 0;padding:0}
ul.rank li{display:grid;grid-template-columns:auto minmax(0,1fr) 64px var(--vw,auto);align-items:center;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
ul.rank li:last-child{border-bottom:0}
ul.rank li:not(:has(svg)){grid-template-columns:minmax(0,1fr) 64px var(--vw,auto)}
ul.rank .rn{min-width:0;overflow-wrap:anywhere}
ul.rank .rn small{color:var(--mut);font-size:12.5px}
ul.rank .rt{height:6px;border-radius:3px;background:var(--one-track);overflow:hidden}
ul.rank .rf{display:block;height:100%;border-radius:3px;background:var(--one)}
ul.rank .rv{font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
ul.rank .di,ul.rank svg.ti{width:22px;height:22px;fill:none;stroke:var(--one);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* Insights: the week grid, and the "needs more" note */
.heat{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:3px;margin:12px 0 4px;font-size:12px}
.heat .hh{text-align:center;color:var(--mut);padding-bottom:2px}
.heat .hr{color:var(--mut);padding-right:6px;align-self:center;font-size:12.5px}
.heat .hc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40px;border-radius:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.heat .hc b{font-size:13px;font-weight:600;line-height:1.1}.heat .hc small{font-size:10.5px;opacity:.8}
.heat .hc.dk{color:light-dark(#FBF6EE,#1E1B18)}
.heat .hc.none{background:var(--bg)}
.msg.need{color:var(--mut)}
/* What you like: your coffee type, one tile per kind, something to try next */
.typecard{margin:6px 0 14px;padding:16px 16px 14px;border-radius:14px;background:var(--one-track)}
.typecard .tk{margin:0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.typecard .tt{margin:6px 0 4px;font-size:21px;line-height:1.3;font-weight:600;color:var(--ink)}
.typecard .ts{margin:0;font-size:13.5px;color:var(--mut)}
.typecard .tt.rec{font-size:17.5px;line-height:1.4}
.typecard .tl{margin:6px 0 8px;font-size:15.5px;line-height:1.45;color:var(--ink)}
/* every card: the title with a small (i) for the explanation */
.card .chd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .chd h2{margin-bottom:0}
.card .info{flex:none;width:26px;height:26px;margin-top:2px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);font:italic 600 13px/1 Georgia,serif;cursor:pointer}
.card .info[aria-expanded=true]{background:var(--one-track);color:var(--ink)}
.card .chd + .what{margin-top:8px}
.card > .chd + :not(.what){margin-top:10px}
svg.ti{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Your taste: badges, the scales, what costs stars */
.hero{display:grid;gap:6px;margin-top:6px}
.hk{margin:10px 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--one-track);color:var(--one)}
.badge svg.ti{width:26px;height:26px}
.badge b{display:block;color:var(--ink);font-size:15.5px;line-height:1.2}
.badge small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.meters{display:grid;gap:10px;margin-top:2px}
.tm{display:grid;grid-template-columns:62px minmax(0,1fr) 108px;align-items:center;gap:10px;font-size:14px}
.tml{display:flex;align-items:center;gap:6px;text-transform:capitalize}.tml i{width:8px;height:8px;border-radius:50%;flex:none}
.tmt{position:relative;height:8px;border-radius:4px;background:var(--one-track)}
.tmc{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--axis);border-radius:1px}
.tmd{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)}
.tmw{font-size:13px;color:var(--mut)}
.costs{display:flex;flex-wrap:wrap;gap:8px}
.cost{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);color:var(--f-sweet)}
.cost b{color:var(--ink);font-size:14.5px}.cost span{color:var(--mut);font-size:13.5px;font-variant-numeric:tabular-nums}
.card .foot{margin:12px 0 0;font-size:13px;color:var(--mut)}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--one-track);font-size:14px;color:var(--ink)}
.nchip svg.ti{width:16px;height:16px;color:var(--one)}.nchip b{font-size:13px;font-variant-numeric:tabular-nums}
.nchip.flat{background:none;border:1px solid var(--line);color:var(--mut)}.nchip.flat svg.ti{color:var(--mut)}
.ratios{display:grid;gap:8px;margin-top:4px}
.likes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 18px}
.likes .lgh{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-family:inherit;font-weight:600}
.likes .lgh svg.ti{width:18px;height:18px;color:var(--one)}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mtile{padding:10px 12px;border-radius:14px;background:var(--one-track)}
.mtile small{display:block;font-size:12px;color:var(--mut)}.mtile b{display:block;font-size:16px;margin:2px 0}.mtile span{font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.trynext svg.ti{width:16px;height:16px;vertical-align:-3px;margin-right:4px;color:var(--one)}
.rat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--one-track)}
.rat svg{width:30px;height:30px;color:var(--one);fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rtx small{display:block;font-size:12.5px;color:var(--mut)}.rtx b{display:block;font-size:22px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:500;font-variant-numeric:tabular-nums}
.rside{display:grid;justify-items:end;gap:4px}.rside small{font-size:12px;color:var(--mut)}
.gchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--card);font-size:13px}.gchip svg.ti{width:15px;height:15px;color:var(--one)}
ul.rank .medal{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--one-track);font-size:12.5px;font-weight:700;color:var(--mut)}
ul.rank .medal.m1{background:#D4A73A;color:#fff}ul.rank .medal.m2{background:#A9A9A2;color:#fff}ul.rank .medal.m3{background:#B87A4B;color:#fff}
ul.rank li:has(.medal){grid-template-columns:auto minmax(0,1fr) 64px var(--vw,auto)}
.stab{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:12px;vertical-align:middle}
.stab svg.ti{width:16px;height:16px}.stab.ok{color:var(--f-bitter)}.stab.bump{color:var(--f-sweet)}
/* the barista race */
.card h2 .h2i{width:22px;height:22px;vertical-align:-3px;margin-right:8px;color:var(--accent)}
.lead{margin:8px 0 6px;padding:2px 0 2px 14px;border-left:2px solid var(--accent)}
.lead small,.ttl small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.lead p{margin:2px 0 0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:19px;line-height:1.35;color:var(--ink)}
.race{display:grid;gap:14px;margin:16px 0 18px}
.lane.unsure{opacity:.5}
.lhead{display:flex;align-items:baseline;gap:10px}
.lpos{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px;color:var(--mut);min-width:14px}
.lname{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lval{font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;color:var(--mut)}
.lane:first-child .lval{color:var(--ink)}
.track{position:relative;display:block;height:28px;margin-top:2px;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.track::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--line)}
.runner{position:absolute;top:50%;transform:translate(-50%,-50%)}
.runner .av{width:26px;height:26px;font-size:11.5px;box-shadow:0 0 0 3px var(--card)}
.flag{position:absolute;right:0;top:5px;bottom:5px;width:1px;background:var(--mut)}
.titles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:0 14px;margin-top:16px;border-top:1px solid var(--line)}
.ttl{padding:12px 0 2px}.ttl b{display:block;margin-top:3px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:500;font-size:16px}
ul.worked{list-style:none;margin:8px 0 4px;padding:0}
ul.worked li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
ul.worked li:last-child{border-bottom:0}
.wtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 6px}
.wt{padding:12px 12px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.wt .wh{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.wt .wi{width:18px;height:18px;fill:none;stroke:var(--one);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wt b{display:block;margin-top:6px;font-size:17px;line-height:1.25}
.wt .wv{margin:3px 0 0;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.wt .wv strong{font-size:15px;color:var(--ink);margin-right:2px}
.wt .wv .up{color:var(--ink)}
.wt .wr{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.wt.close{border-style:dashed}
.trynext{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14.5px}
.likes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 28px}
.likes h3{margin:16px 0 0;font-size:15px}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:8px;border-radius:50%;color:#fff;font-size:12.5px;font-weight:600;flex:none}
.ctl .range{display:flex;align-items:center;gap:8px;flex:1 1 100%;font-size:14.5px;color:var(--mut)}
.ctl .range[hidden]{display:none}
.ctl .range input{flex:1 1 0;min-width:0;height:42px;line-height:40px;box-sizing:border-box;margin:0;padding:0 12px;font:inherit;font-size:15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.banner{margin:0 0 14px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line);background:var(--card);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin:0 0 18px}
.card h2{margin:0;font-size:19px}
.card .what{margin:4px 0 10px;color:var(--mut);font-size:14px}
.card .take{margin:8px 0 2px;font-size:14.5px;color:var(--ink)}
.box{position:relative;width:100%}
.msg{padding:22px 8px;text-align:center;color:var(--mut);font-size:14px}
svg.ch{display:block;overflow:visible;touch-action:pan-y}
svg.ch text{font-size:12px;fill:var(--mut);font-variant-numeric:tabular-nums}
svg.ch .lab{font-size:12px}
svg.ch .grid{stroke:var(--grid);stroke-width:1}
svg.ch .base{stroke:var(--axis);stroke-width:1}
svg.ch .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .dot{stroke:var(--card);stroke-width:2}
svg.ch .dot.hollow{fill:var(--card);stroke-width:2}
svg.ch .cloud{fill:var(--mut);opacity:.28}
svg.ch .hit{fill:transparent}
svg.ch .pad{fill:transparent;outline:none}
svg.ch .hair{stroke:var(--axis);stroke-width:1}
svg.ch .trail{fill:none;stroke:var(--axis);stroke-width:1.5;stroke-linejoin:round}
svg.ch .lastring{fill:none;stroke:var(--ink);stroke-width:1.5}
svg.ch .zone{fill:var(--one);opacity:.08}
svg.ch .zlab{font-size:11.5px;fill:var(--mut)}
svg.ch .rl{fill:var(--ink);font-size:13px}
svg.ch .val{fill:var(--ink);font-size:13px;font-weight:600}
svg.ch .note{font-size:12px}
svg.ch .endlab{fill:var(--ink);font-size:12.5px}
svg.ch .stem{stroke:var(--axis);stroke-width:2}
svg.ch .pt.faded .dot{stroke:var(--card);stroke-width:1}
svg.ch .pt.hot .dot,svg.ch .bar.hot path,svg.ch .bar.hot .dot{filter:brightness(1.12)}
svg.ch g:focus{outline:none}
svg.ch g:focus-visible .hit{stroke:var(--ink);stroke-width:1.5}
.ctip{position:absolute;z-index:60;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(20,14,10,.18);font-size:13px;color:var(--ink)}
.ctip .ct{color:var(--mut);font-size:12px;margin-bottom:4px}
.ctip .cr{display:flex;align-items:center;gap:7px;line-height:1.5}
.ctip .cr b{font-weight:650}
.ctip .cr span{color:var(--mut)}
.ctip .kl{display:inline-block;width:12px;height:3px;border-radius:2px}
.ctip .kd{display:inline-block;width:9px;height:9px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 2px}
.leg{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:none;font:inherit;font-size:13px;color:var(--ink)}
button.leg{cursor:pointer}
.leg i{width:12px;height:3px;border-radius:2px;background:var(--col)}
.leg i.d{width:10px;height:10px;border-radius:50%}
.leg i.dash{width:16px;background:repeating-linear-gradient(90deg,var(--col) 0 4px,transparent 4px 7px)}
.leg i.h{width:8px;height:8px;border-radius:50%;background:none;border:2px solid var(--mut)}
.leg[aria-pressed=false]{opacity:.45}
.ramp{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.ramp i{display:inline-block;width:14px;height:10px;border-radius:3px}
.subctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.subctl select{font:inherit;font-size:14px;min-height:38px;border-radius:999px;flex:1 1 160px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 18px}
.grid2 h3{margin:12px 0 0;font-size:15px}
.grid2 .small{margin:2px 0 0;color:var(--mut);font-size:13px}
.balm{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;margin-top:8px;font-size:14px}
.balm .tr{height:8px;border-radius:4px;background:var(--one-track);overflow:hidden}
.balm .fl{display:block;height:100%;border-radius:4px;background:var(--one)}
.balm b{font-variant-numeric:tabular-nums}
.balm .small{grid-column:1/-1;margin:0;color:var(--mut);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:4px 0 6px}
.tile{padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.tile .tl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.tile .tl i{width:10px;height:10px;border-radius:50%;background:var(--col)}
.tile .tv{margin-top:2px;font-size:26px;font-weight:600;color:var(--ink)}
.tile .ts{font-size:13px;color:var(--mut)}
/* beans left: the open bags standing side by side on a shelf, each filled to what is left */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:92px;gap:10px;align-items:start;margin:14px -4px 4px;padding:0 4px 4px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:none;scrollbar-width:none;
  background:linear-gradient(var(--axis),var(--axis)) 0 92px/100% 3px no-repeat;background-attachment:local}
.shelf::-webkit-scrollbar{display:none}
.bagb{display:flex;flex-direction:column;align-items:center;text-align:center;color:inherit;text-decoration:none}
.bagb svg{width:70px;height:91px;overflow:visible;display:block}
.bagb .bf{fill:var(--one);opacity:.85}
.bagb .bo{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.bagb .bo.thin{stroke-width:1}
.bagb b{font-size:13px;font-weight:600;line-height:1.25;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bagb small{font-size:12px;color:var(--mut);line-height:1.3}
.bagb.low small{color:var(--f-sweet)}
.shelfsum{margin:10px 0 0;font-size:14.5px}
/* origins: a world map, the countries you brewed coloured by how many coffees came from there */
.map{position:relative;margin:12px 0 4px}
.map svg{display:block;width:100%;height:auto;touch-action:pan-y}
.map .land{fill:var(--one-track)}
.map .cty{stroke:var(--card);stroke-width:.6;cursor:pointer;vector-effect:non-scaling-stroke}
.map .dot{stroke:var(--card);cursor:pointer}
.map .cty.hot,.map .dot.hot{stroke:var(--ink);stroke-width:2}
.map .belt{stroke:var(--axis);stroke-width:1;stroke-dasharray:4 5;fill:none;vector-effect:non-scaling-stroke}
.map .bl{fill:var(--mut);stroke:var(--card);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.mleg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.mleg i{display:inline-block;width:18px;height:10px;border-radius:2px}
details.num{margin:10px 0 0;font-size:14px}
details.num summary{cursor:pointer;color:var(--mut)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500}
.hint{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Trends</h1>
<p class="sub">What your brews tell you: how to get a coffee right, what you like (and what to buy next), when beans taste best, and who brews what.</p>

<div class="tabs" role="tablist" aria-label="Trends sections">
  <button class="tab" role="tab" data-v="coffee" data-t="This coffee">This coffee</button>
  <button class="tab" role="tab" data-v="taste" data-t="Your taste">Your taste</button>
  <button class="tab" role="tab" data-v="fresh" data-t="Freshness">Freshness</button>
  <button class="tab" role="tab" data-v="us" data-t="Household">Household</button>
</div>

<div class="ctl" id="filters">
  <select id="f-coffee" aria-label="Coffee"></select>
  <select id="f-device" aria-label="Device"></select>
  <select id="f-grinder" aria-label="Grinder" hidden></select>
  <select id="f-who" aria-label="Made by"></select>
  <select id="f-rater" aria-label="Rated by"></select>
  <select id="f-range" aria-label="Time frame"><option value="">All time</option><option value="30">Last 30 days</option><option value="90">Last 3 months</option><option value="365">Last 12 months</option><option value="year">This year</option><option value="custom">Choose dates&hellip;</option></select>
  <span class="range" id="f-dates" hidden><input type="date" id="f-from" aria-label="From"><span>to</span><input type="date" id="f-to" aria-label="To"></span>
  <button id="f-demo" type="button">Example data</button>
</div>
<p class="banner" id="banner" hidden>Example data, to show how the charts look. These are not your brews.</p>

<div id="views"></div>
<p id="msg" class="hint" role="status"></p>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/nav.js" defer></script>

<script src="../assets/js/stars.js"></script>
<script src="../data/devices.js"></script>
<script src="../data/defaults.js"></script>
<script src="../data/world.js"></script>
<script src="../assets/js/people.js"></script>
<script src="../assets/js/caffeine.js"></script>

<script>
const db = supabase.createClient(SUPA.url, SUPA.key);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };
const CORE = SCALE.PROFILE;   // the taste sliders: sour, sweet, bitter (balance is its own 0 to 5 rating, b.balance)
const BCOL = "var(--f-balance)";
const balText = v => SCALE.balanceText(v);
const avgBal = list => { const v = list.map(b => b.balance).filter(x => x != null); return v.length ? { v: avg(v), n: v.length } : null; };   // unrated brews are left out, never counted as 0
const FCOL = { sour: "var(--f-sour)", sweet: "var(--f-sweet)", bitter: "var(--f-bitter)", balance: "var(--f-balance)" };
const RCOL = n => "var(--r" + Math.min(5, Math.max(1, Math.round(n))) + ")";   // half stars round to the nearer colour
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const state = { grinder: "", grinderF: "", range: "", from: "", to: "", prefs: {}, view: "coffee", freshC: "", demo: false, signedIn: false, me: null, coffees: [], brews: [], names: {}, coffee: "", device: "", who: "", rater: "", recipe: "", xk: "roast", hidden: new Set() };

// ---------- helpers ----------
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = n => Math.round(n * 10) / 10;
// dates the European way: dd-mm-yyyy (short dd-mm under the weekly columns)
const p2 = n => String(n).padStart(2, "0");
const fmtDate = d => p2(d.getDate()) + "-" + p2(d.getMonth() + 1) + "-" + d.getFullYear();
const fmtShort = d => p2(d.getDate()) + "-" + p2(d.getMonth() + 1);
const fmtIso = iso => { const [y, m, d] = String(iso).slice(0, 10).split("-"); return d + "-" + m + "-" + y; };
const mmss = n => Math.floor(n / 60) + ":" + String(Math.round(n % 60)).padStart(2, "0");
function typeOf(name) { return window.DEVICES && window.DEVICES.typeOf ? window.DEVICES.typeOf(name) : ""; }   // data/devices.js
const isEsp = dev => { const t = typeOf(dev); return t === "espresso" || t === ""; };
const timeText = b => b.time == null ? null : (isEsp(b.device) && b.time < 90 ? b.time + " s" : mmss(b.time) + " min");
const ratioOf = b => !b.dose ? null : isEsp(b.device) ? (b.yld ? b.yld / b.dose : null) : (b.water ? b.water / b.dose : b.yld ? b.yld / b.dose : null);
const stars = n => Stars.text(n);
const splitOrigin = t => window.DEFAULTS && DEFAULTS.splitOrigin ? DEFAULTS.splitOrigin(t) : { country: t ? String(t).split(",")[0].trim() : null, region: null, countries: [] };
const andList = arr => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
// a coffee by id: a lookup table, made again whenever the list of coffees changes (it is asked for once per brew, often)
let coffeeIdx = null, coffeeIdxOf = null;
const coffeeOf = id => { if (coffeeIdxOf !== state.coffees) { coffeeIdx = new Map(state.coffees.map(c => [c.id, c])); coffeeIdxOf = state.coffees; } return coffeeIdx.get(id) || null; };
const nameOf = id => (id && state.names[id]) || null;
const people = () => Object.keys(state.names).sort((a, b) => state.names[a].localeCompare(state.names[b]));
// each person's colour: the one they chose in Settings, otherwise the same automatic one as in Recent activity
const personCol = id => PEOPLE.color(id, nameOf(id), state.prefs, Object.keys(state.names));
const avatar = id => PEOPLE.avatar(id, nameOf(id) || "?", personCol(id));   // their photo, or their initial in their colour
const shown = (a, v) => SCALE.isCore(a) ? v - 5 : v;   // stored -> -5..+5 for the four core flavours

// Several people can rate one brew. With "Rated by" set, a brew counts with that person's stars and taste
// (and only if they rated it); otherwise with the average of everyone who rated it.
const GUEST = "guest";
const raterKey = r => r.guest ? GUEST : r.who;
function asRated(b) {
  const rs = state.rater ? b.ratings.filter(r => raterKey(r) === state.rater) : b.ratings;
  if (state.rater && !rs.length) return null;
  const st = rs.map(r => r.rating).filter(v => v != null), sc = {}, n = {};
  rs.forEach(r => Object.entries(r.scores).forEach(([a, v]) => { sc[a] = (sc[a] || 0) + v; n[a] = (n[a] || 0) + 1; }));
  Object.keys(sc).forEach(a => { sc[a] = sc[a] / n[a]; });
  const bl = rs.map(r => r.balance).filter(v => v != null);
  return Object.assign({}, b, { rating: st.length ? avg(st) : null, balance: bl.length ? avg(bl) : null, scores: sc });
}
// brews after the device / person filters (and the coffee filter where the view uses it)
function filtered(useCoffee) {
  const [t0, t1] = rangeOf();
  return state.brews.filter(b => (!state.device || b.device === state.device) && (!state.grinderF || b.grinder === state.grinderF) && (!state.who || b.who === state.who) && (!useCoffee || !state.coffee || grpOf(b) === state.coffee) && b.t >= t0 && b.t < t1).map(asRated).filter(Boolean);
}
// the time frame (Time frame filter): [from, to) as dates; all time unless you chose one
function rangeOf() {
  const now = new Date(), day = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  if (state.range === "year") return [new Date(now.getFullYear(), 0, 1), new Date(8.64e15)];
  if (/^\d+$/.test(state.range)) return [new Date(now.getTime() - Number(state.range) * 864e5), new Date(8.64e15)];
  if (state.range === "custom") { const a = state.from ? day(state.from) : new Date(-8.64e15), b = state.to ? day(state.to) : null; if (b) b.setDate(b.getDate() + 1); return [a, b || new Date(8.64e15)]; }
  return [new Date(-8.64e15), new Date(8.64e15)];
}

// A ranked list in plain HTML: icon (optional), the name (wraps, never cut off), a thin bar, the number
function rankList(rows) {
  const ul = el("ul", "rank");
  // the numbers column is as wide as its longest number on every row, so the bars line up
  ul.style.setProperty("--vw", Math.max(...rows.map(r => String(r.text).length), 1) * 0.6 + 0.4 + "em");
  rows.forEach(r => {
    const li = el("li"); if (r.icon) li.appendChild(r.icon);
    const nm = el("span", "rn", r.label); if (r.sub) nm.appendChild(el("small", "", " " + r.sub));
    const tr = el("span", "rt"), fl = el("span", "rf"); fl.style.width = Math.max(2, 100 * r.value / (r.max || 1)) + "%"; tr.appendChild(fl);
    li.append(nm, tr, el("b", "rv", r.text)); ul.appendChild(li);
  });
  return ul;
}
// small device icons (assets/js/devicons.js)
function devIcon(name) { return DEVICONS.svg(name, typeOf(name), "di"); }

// ---------- page frame ----------
function card(title, what) {
  const c = el("section", "card"), h = el("div", "chd"); h.appendChild(el("h2", "", title)); c.appendChild(h);
  if (what) {   // the explanation: behind a small (i), so the page reads as headlines and pictures
    const p = el("p", "what", what), b = el("button", "info", "i"); p.hidden = true;
    b.type = "button"; b.setAttribute("aria-label", "What does this show?"); b.setAttribute("aria-expanded", "false");
    b.onclick = () => { p.hidden = !p.hidden; b.setAttribute("aria-expanded", String(!p.hidden)); };
    h.appendChild(b); c.appendChild(p);
  }
  $("views").appendChild(c); return c;
}
// small line icons for the taste tab
const IC = {
  process: "M12 3c3 4 5 6.5 5 9.5a5 5 0 01-10 0C7 9.5 9 7 12 3z", roast: "M12 3c1 3 4 4.5 4 8.5a4 4 0 01-8 0c0-1.8.8-3 2-4 0 1.5.6 2.5 1.6 2.5C11.6 7.5 11 5 12 3z M7 20h10",
  origin: "M12 21s-6-5.5-6-10a6 6 0 1112 0c0 4.5-6 10-6 10z M12 9v.01", altitude: "M3 19l6-10 4 6 2-3 6 7z",
  warn: "M12 4l9 16H3z M12 10v4 M12 17v.01", grind: "M7 4h10l-2 6H9z M9 10v4h6v-4 M8 14h8l1 6H7z", ratio: "M7 4h4v16H7z M13 9h4v11h-4z",
  temp: "M10 14V5a2 2 0 114 0v9a4 4 0 11-4 0z M12 9v6", dose: "M12 4c3.3 0 5 3.4 5 8s-1.7 8-5 8-5-3.4-5-8 1.7-8 5-8z M12 4c-1.2 2.5-1.2 5.5 0 8s1.2 5.5 0 8",
  roastday: "M5 6h14v14H5z M5 10h14 M9 3v5 M15 3v5", clock: "M12 7v5l3 2 M12 21a9 9 0 110-18 9 9 0 010 18z", timer: "M12 9v4l2 2 M9 2h6 M12 21a8 8 0 110-16 8 8 0 010 16z",
  person: "M12 12a4 4 0 100-8 4 4 0 000 8z M4.5 20.5a7.5 7.5 0 0115 0", device: "M4 5h16l-6 9h-4L4 5z M12 14v3 M7 20h10", leaf: "M5 19c0-8 5-14 14-14 0 9-6 14-14 14z M5 19l7-7",
  trophy: "M8 4h8v5a4 4 0 01-8 0z M8 6H5a3 3 0 003 4 M16 6h3a3 3 0 01-3 4 M12 13v4 M8 20h8 M9 17h6v3H9z",
  steady: "M3 12h18", bumpy: "M3 15l4-6 4 8 4-8 4 6", star: "M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"
};
function ic(name, cls) {
  const NS = "http://www.w3.org/2000/svg", s = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "path");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "ti" + (cls ? " " + cls : "")); s.setAttribute("aria-hidden", "true");
  p.setAttribute("d", IC[name] || IC.star); s.appendChild(p); return s;
}
// a taste on its scale: "just right" in the middle, a dot where your best cups are
function meter(label, v, color, words) {
  const r = el("div", "tm"), tr = el("div", "tmt"), dot = el("span", "tmd");
  tr.appendChild(el("span", "tmc")); dot.style.left = (Math.max(-5, Math.min(5, v)) + 5) * 10 + "%"; dot.style.background = color; tr.appendChild(dot);
  const word = Math.abs(v) < 0.75 ? "just right" : (Math.abs(v) > 2 ? "clearly " : "a little ") + (v < 0 ? words[0] : words[1]);
  const lb = el("span", "tml"); const sw = el("i"); sw.style.background = color; lb.append(sw, document.createTextNode(label));
  r.append(lb, tr, el("span", "tmw", word)); return r;
}
function chartBox(parent) { const b = el("div", "box"); parent.appendChild(b); return b; }
function numbers(parent, headers, rows) {
  const d = el("details", "num"); d.appendChild(el("summary", "", "Show the numbers"));
  const w = el("div", "wrap"); w.appendChild(Charts.table(headers, rows)); d.appendChild(w); parent.appendChild(d);
}
function empty(parent, text) { parent.appendChild(el("p", "msg", text)); }
function legendItem(parent, color, label, kind, onToggle, pressed) {
  const b = el(onToggle ? "button" : "span", "leg"); if (onToggle) { b.type = "button"; b.setAttribute("aria-pressed", String(pressed)); b.onclick = onToggle; }
  const i = el("i", kind === "dot" ? "d" : kind === "hollow" ? "h" : kind === "dash" ? "dash" : ""); i.style.setProperty("--col", color); b.append(i, document.createTextNode(label)); parent.appendChild(b); return b;
}
function starRamp(parent, withUnrated) {
  const r = el("div", "legend"), w = el("span", "ramp");
  w.appendChild(document.createTextNode("1★"));
  for (let n = 1; n <= 5; n++) { const i = el("i"); i.style.background = RCOL(n); w.appendChild(i); }
  w.appendChild(document.createTextNode("5★"));
  r.appendChild(w);
  if (withUnrated) legendItem(r, "var(--mut)", "not rated", "hollow");
  parent.appendChild(r);
}
function brewTip(b, extra) {
  const c = coffeeOf(b.coffeeId), rows = [];
  (extra || []).forEach(x => rows.push(x));
  if (b.rating) rows.push({ value: stars(b.rating), label: b.dialin ? "dial-in" : "" });
  if (b.balance != null) rows.push({ value: balText(b.balance), label: "balance", color: BCOL, kind: "dot" });
  const parts = [grindText(b), timeText(b), ratioOf(b) ? "1:" + r1(ratioOf(b)) : null].filter(Boolean).join(", ");
  if (parts) rows.push({ value: parts });
  if (nameOf(b.who)) rows.push({ value: nameOf(b.who), label: "made it" });
  return { title: fmtDate(b.t) + (c ? " · " + c.name : "") + (b.device ? " · " + b.device : ""), rows };
}

// ---------- 1 + 2: dial-in map and taste compass ----------
// ---------- This coffee: one coffee, with all its bags ----------
// its brews on one device at a time (grind, time and ratio are only comparable on one device)
function coffeeList() {
  let list = filtered(true), devNote = "";
  if (!state.device && list.length) {
    const counts = {}; list.forEach(b => { if (b.device) counts[b.device] = (counts[b.device] || 0) + 1; });
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    if (top && Object.keys(counts).length > 1) { list = list.filter(b => b.device === top); devNote = "Showing " + top + ", the device used most for this coffee. Pick another device above."; }
  }
  return { list, devNote };
}
function viewCoffee() {
  const c = groupCoffee(state.coffee);
  if (!c) { const m = card("This coffee", null); empty(m, "Pick a coffee above."); return; }
  const { list, devNote } = coffeeList();
  whatWorked(list, c, devNote);
  brewingChart(list, c);
  viewTime();
  whichDevice(state.coffee);
  whichGrinder(list);
  insMilk(filtered(true).filter(b => !b.dialin), true);
}

// What worked: your best cup of this coffee, and which settings went with better cups. Every setting is compared on one
// device, the grind also on one grinder (grinders count differently), by brews above its middle value against below.
// the grind as a word (fine ... coarse): the same on every grinder, unlike the numbers (from the brew form's Feel)
const FEELS = ["extra fine", "fine", "medium-fine", "medium", "medium-coarse", "coarse", "extra coarse"];
const feelRank = b => { const i = b.feel ? FEELS.indexOf(b.feel) : -1; return i < 0 ? null : i; };
const grindText = b => b.grind != null && b.grind !== "" ? "grind " + b.grind + (b.feel ? " (" + b.feel + ")" : "") + (b.grinder ? " on the " + b.grinder : "") : b.feel ? b.feel + " grind" : null;
const tasteX = b => { const so = b.scores.sour, bi = b.scores.bitter; if (so == null && bi == null) return null; return ((bi != null ? shown("bitter", bi) : 0) - (so != null ? shown("sour", so) : 0)) / (so != null && bi != null ? 2 : 1); };
function whatWorked(list, c, devNote) {
  const m = card("What worked", "Your best cup of this coffee so far, with its whole recipe. Below it, for each setting you varied (grind, ratio, water temperature, dose): which way went with more stars.");
  if (devNote) m.appendChild(el("p", "what", devNote));
  const rated = list.filter(b => b.rating != null && !b.dialin);
  const gc = {}; list.forEach(b => { if (b.grind != null && b.grind !== "") { const g = b.grinder || "Grinder not set"; gc[g] = (gc[g] || 0) + 1; } });
  const gs = Object.keys(gc).sort((a, b) => gc[b] - gc[a]);
  if (state.grinder && !gc[state.grinder]) state.grinder = "";
  const gr = state.grinder || gs[0] || "";
  if (gs.length > 1) {
    const sub = el("div", "subctl"), sel = el("select"); sel.setAttribute("aria-label", "Grinder");
    gs.forEach(g => { const o = el("option", "", g + " (" + gc[g] + ")"); o.value = g; sel.appendChild(o); });
    sel.value = gr; sel.onchange = () => { state.grinder = sel.value; render(); }; sub.appendChild(sel); m.appendChild(sub);
  }
  if (!rated.length) { needMore(m, "Rate a brew of this coffee and your best cup shows up here."); return; }
  const best = rated.slice().sort((a, b) => b.rating - a.rating || b.t - a.t)[0];
  const parts = [best.device, grindText(best), best.dose ? best.dose + " g in" : null,
    isEsp(best.device) ? (best.yld ? best.yld + " g out" : null) : (best.water ? best.water + " g water" : null), ratioOf(best) ? "1:" + r1(ratioOf(best)) : null, timeText(best), best.temp ? best.temp + " °C" : null].filter(Boolean);
  const bx = el("div", "typecard");
  bx.append(el("p", "tk", "Your best cup so far"), el("p", "tt rec", parts.join(", ")),
    el("p", "ts", stars(best.rating) + ", " + fmtDate(best.t) + (nameOf(best.who) ? ", made by " + nameOf(best.who) : "") + (rated.length > 1 ? " · from " + rated.length + " rated brews" : "")));
  m.appendChild(bx);
  const SET = [   // what, lower, higher, value
    ["The grind", "a lower grind number", "a higher grind number", b => (b.grinder || "Grinder not set") === gr ? numOf(b.grind) : null],
    ["The ratio", "less water for the coffee", "more water for the coffee", b => ratioOf(b)],
    ["The water temperature", "cooler water", "hotter water", b => numOf(b.temp)],
    ["The dose", "less coffee", "more coffee", b => numOf(b.dose)]
  ];
  const found = [], thin = [];
  SET.forEach(([what, lo, hi, get]) => {
    const xs = rated.map(b => [get(b), b]).filter(x => x[0] != null);
    const vs = xs.map(x => x[0]).sort((a, b) => a - b);
    if (xs.length < 4 || vs[0] === vs[vs.length - 1]) { thin.push(what.replace(/^The /, "")); return; }
    const med = (vs[Math.floor((vs.length - 1) / 2)] + vs[Math.ceil((vs.length - 1) / 2)]) / 2;
    const H = xs.filter(x => x[0] > med).map(x => x[1]), L = xs.filter(x => x[0] < med).map(x => x[1]);
    if (H.length < 2 || L.length < 2) { thin.push(what.replace(/^The /, "")); return; }
    const d = avg(H.map(b => b.rating)) - avg(L.map(b => b.rating));
    const tx = arr => { const v = arr.map(tasteX).filter(v => v != null); return v.length >= 2 ? avg(v) : null; };
    const th = tx(H), tl = tx(L), dt = th != null && tl != null ? (d >= 0 ? th - tl : tl - th) : null;   // the taste of the better side, against the other
    found.push({ what, d: Math.abs(d), better: d >= 0 ? hi : lo, dt, n: H.length + L.length });
  });
  if (!found.length) { needMore(m, "Change one thing at a time over a few brews (at least four rated brews where it changes), and what worked shows here."); return; }
  found.sort((a, b) => b.d - a.d);
  const ul = el("ul", "worked");
  found.forEach(x => {
    const li = el("li");
    if (x.d < 0.2) li.append(el("b", "", x.what), document.createTextNode(" made little difference to your stars."));
    else li.append(el("b", "", "Better with " + x.better), document.createTextNode(": +" + r1(x.d).toFixed(1) + "★" + (x.dt != null && Math.abs(x.dt) >= 0.75 ? ", and the cups tasted " + (x.dt > 0 ? "less sour, more toward bitter" : "less bitter, more toward sour") : "") + " (" + x.n + " brews)."));
    ul.appendChild(li);
  });
  m.appendChild(ul);
  if (found.some(x => x.what === "The grind")) m.appendChild(el("p", "small", "The grind is compared on " + (gr && gr !== "Grinder not set" ? "the " + gr : "one grinder") + " only, because a \u201C15\u201D means something different on every grinder. On most grinders a lower number is finer."));
  if (thin.length) m.appendChild(el("p", "what", "Not enough yet for " + andList(thin) + ": it needs a few rated brews where it changes."));
}
// Which device suits it: this coffee's stars per device (only when it was brewed on more than one)
function whichDevice(k) {
  const list = filtered(false).filter(b => grpOf(b) === k && b.rating != null && !b.dialin && b.device);
  const by = {}; list.forEach(b => (by[b.device] = by[b.device] || []).push(b.rating));
  const rows = Object.keys(by).map(d => ({ d, v: avg(by[d]), n: by[d].length })).sort((a, b) => b.v - a.v || b.n - a.n);
  if (rows.length < 2) return;
  const m = card("Which device suits it", "Your stars for this coffee on each device you brewed it with.");
  const a = rows[0], b = rows[1];
  m.appendChild(el("p", "take", a.v - b.v >= 0.25 && a.n >= 2 ? a.d + " suits this coffee best for you: " + fmtS(a.v) + " (" + a.n + " brews), against " + fmtS(b.v) + " on " + b.d + "." : "About the same on " + andList(rows.map(r => r.d)) + " so far."));
  m.appendChild(rankList(rows.map(r => ({ icon: devIcon(r.d), label: r.d, sub: "(" + r.n + ")", value: r.v, max: 5, text: fmtS(r.v) }))));
}

// 2. Your dial-in curve: the stars of brew 1, 2, 3 ... of each bag

// 3. Does an open bag fade? Stars by week since opening (each bag against its own average), and how fast a bag goes
function insOpenBag(list) {

// 5. Milk or black: the same coffees, with and without milk

// 6. Caffeine and sleep (only with the Sleep check on): the caffeine left at your bedtime against how you slept
function insSleep() {
  const p = (state.me && state.prefs[state.me.id]) || {};
  if (state.demo || p.sleep !== "on" || !p.sleep_consent || !Array.isArray(state.sleep) || !window.CAFFEINE) return;
  const m = card("Caffeine and sleep", "The caffeine still in you at your bedtime (from your own cups) against how you slept that night. Only you see this.");
  const line = p.caf_line != null && Number(p.caf_line) >= 0 ? Number(p.caf_line) : 50, bed = /^\d\d:\d\d$/.test(p.caf_bed || "") ? p.caf_bed : "22:30";
  const me = state.me.id, doses = [];
  (state.raw || []).forEach(b => {
    const c = coffeeOf(b.coffee_id), r = CAFFEINE.row(b, c), k = r.r.indexOf(me);
    if (k < 0 || !(r.g > 0)) return;
    doses.push({ t: Date.parse(r.rt[k] || r.t), mg: CAFFEINE.mg(r).mg / r.r.length });
  });
  const nights = state.sleep.map(s => {
    const [y, mo, d] = s.night.split("-").map(Number), [hh, mm] = bed.split(":").map(Number), at = new Date(y, mo - 1, d, hh, mm);
    if (hh < 12) at.setDate(at.getDate() + 1);   // a bedtime after midnight belongs to the night before
    return { mg: CAFFEINE.level(doses, at.getTime()), q: s.quality };

  if (nights.length < 6) { needMore(m, "This needs " + (6 - nights.length) + " more answers to the Sleep check."); return; }
  const B = [["0\u201325 mg", 0, 25], ["25\u201350 mg", 25, 50], ["50\u2013100 mg", 50, 100], ["100+ mg", 100, 1e9]];
  const rows = B.map(([label, lo, hi]) => { const xs = nights.filter(n => n.mg >= lo && n.mg < hi); return { label, n: xs.length, well: xs.length ? xs.filter(n => n.q === 3).length / xs.length : null, bad: xs.length ? xs.filter(n => n.q === 1).length / xs.length : null }; }).filter(r => r.n);
  const under = nights.filter(n => n.mg < line), over = nights.filter(n => n.mg >= line), pw = xs => Math.round(100 * xs.filter(n => n.q === 3).length / xs.length);
  m.appendChild(el("p", "take", under.length >= 2 && over.length >= 2

    : "Most nights you were " + (over.length > under.length ? "above" : "under") + " your sleep line (" + line + " mg) at bedtime, so there is nothing to compare yet."));
  const box = chartBox(m);
  Charts.hbars({ box, domain: [0, 100], xTicks: [0, 50, 100], color: "var(--one)", xFmt: v => v + "%", rows: rows.map(r => ({ label: r.label, value: Math.round(100 * r.well), text: Math.round(100 * r.well) + "% slept well", sub: "(" + r.n + ")", tip: () => ({ title: r.label + " at bedtime", rows: [{ value: Math.round(100 * r.well) + "%", label: "slept well" }, { value: Math.round(100 * r.bad) + "%", label: "slept badly" }, { value: String(r.n), label: r.n === 1 ? "night" : "nights" }] }) })) });
  numbers(m, ["Caffeine at bedtime", "Nights", "Slept well", "Slept badly"], rows.map(r => [r.label, r.n, Math.round(100 * r.well) + "%", Math.round(100 * r.bad) + "%"]));
  m.appendChild(el("p", "what", "A rough guide: caffeine is worked out from your cups (see Settings, Caffeine), and sleep has many other reasons."));
}

  // the household chosen in the Journal (after supabase/15_households.sql); before that, everything you can see
  let hh = null;
  const hm = await db.from("household_members").select("household_id").eq("user_id", state.me.id);
  if (!hm.error && hm.data.length) { const saved = store.get("alto.household"); hh = (hm.data.find(x => x.household_id === saved) || hm.data[0]).household_id; }
  const cq = db.from("coffees").select("*");
  const [cs, bs, ps, sl] = await Promise.all([
    (hh ? cq.eq("household_id", hh) : cq).order("created_at", { ascending: false }),
    db.from("brews").select("*, brew_ratings(id,rater_id,is_guest,guest_name,rating,balance,drink,milk,drank_at), brew_scores(attribute,score,rating_id)").order("brewed_at"),
    db.from("profiles").select("id,display_name,prefs,photo_path").then(r => r.error ? db.from("profiles").select("id,display_name,prefs") : r),   // photos: after supabase/34_friends_more.sql
    db.from("sleep_logs").select("night,quality")   // your own answers to the Sleep check (only you can read them); before supabase/31_sleep.sql: an error, left out
  ]);
  $("msg").textContent = "";
  if (cs.error || bs.error) { $("msg").textContent = "Could not load: " + (cs.error || bs.error).message; return; }
  state.coffees = cs.data.map(c => Object.assign({}, c, { bag_g: c.bag_size_g || null }));
  state.names = {}; state.prefs = {};
  (ps.data || []).forEach(p => { state.names[p.id] = p.display_name; state.prefs[p.id] = p.prefs || {}; });
  (ps.data || []).forEach(p => { const m = {}; ((p.prefs || {}).custom_devices || []).forEach(d => { if (d && d.n) m[d.n] = d.t; }); if (window.DEVICES && DEVICES.register) DEVICES.register(m); });   // their own devices, with their kind
  const ph = {}; (ps.data || []).forEach(p => { if ("photo_path" in p) ph[p.id] = p.photo_path; }); PEOPLE.photos(db, ph);
  const ids = new Set(state.coffees.map(c => c.id));
  state.raw = bs.data.filter(b => ids.has(b.coffee_id));
  state.brews = shape(state.raw, state.coffees);
  state.sleep = sl && !sl.error && Array.isArray(sl.data) ? sl.data : null;
  fillFilters(); render();
}

// Example data: made up, only to show how the charts look.
function demo() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const day = n => { const d = new Date(); d.setHours(8, 0, 0, 0); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  const coffees = [
    { id: "d1", name: "Colombia Huila", roaster: "Coffee Collective", origin: "Colombia, Huila", process: "Washed", roast_level: "Light", altitude_min_m: 1700, altitude_max_m: 1900, roast_date: day(40), open_date: day(34), bag_size_g: 1000, price_eur: 42, created_at: day(36) },
    { id: "d2", name: "Ethiopia Guji", roaster: "80 Cup", origin: "Ethiopia, Guji", process: "Natural", roast_level: "Medium-light", altitude_min_m: 2000, altitude_max_m: 2200, roast_date: day(30), open_date: day(22), bag_size_g: 340, price_eur: 17.5, created_at: day(24) },
    { id: "d3", name: "Brazil Cerrado", roaster: "Fjord", origin: "Brazil, Cerrado", process: "Pulped natural", roast_level: "Medium-dark", altitude_min_m: 1100, roast_date: day(55), open_date: day(48), bag_size_g: 1000, archived: false, price_eur: 24, created_at: day(50) }
  ];
  const brews = []; let n = 0;
  coffees.forEach((c, ci) => {
    const roast = Math.round((Date.now() - new Date(c.roast_date + "T00:00:00")) / 864e5), opened = Math.round((Date.now() - new Date(c.open_date + "T00:00:00")) / 864e5);
    for (let d = opened; d >= 0; d -= 1 + Math.floor(rnd() * 3)) {
      const flair = rnd() < 0.72, age = roast - d, who = rnd() < 0.55 ? "pa" : "pb";
      const grind = flair ? 18 + Math.floor(rnd() * 12) : 55 + Math.floor(rnd() * 25);
      const time = flair ? Math.round(20 + (30 - grind) * 2.6 + rnd() * 10) : Math.round(150 + (80 - grind) * 2 + rnd() * 30);
      const ext = flair ? (time - 42) / 6 : (time - 200) / 25;   // + is over, - is under
      const fresh = -Math.abs(age - 14) / 9;
      const rating = Math.max(1, Math.min(5, Math.round(4.2 - Math.abs(ext) * 0.7 + fresh + (who === "pa" ? 0.2 : -0.2) + (ci === 1 ? 0.3 : 0) + (rnd() - 0.5))));
      const dose = flair ? 18 : 30, yld = flair ? Math.round(36 + rnd() * 12) : 440, water = flair ? null : 500;
      const sc = (v) => Math.max(0, Math.min(10, Math.round(v)));
      brews.push({ id: "b" + (++n) + "x", coffee_id: c.id, brewed_at: new Date(Date.now() - d * 864e5 - rnd() * 3e6).toISOString(), device: flair ? "Manual espresso machine" : "Hario V60", grinder: flair ? (rnd() < 0.6 ? "Comandante C40" : "Kingrinder K6") : "Fellow Ode", grind_feel: flair ? (grind < 22 ? "extra fine" : "fine") : (grind < 65 ? "medium-fine" : "medium"),
        grind: String(grind), dose_g: dose, yield_g: yld, water_g: water, time_s: time, temp_c: flair ? 93 : 88 + Math.floor(rnd() * 9), rating: rnd() < 0.9 ? rating : null, is_dialin: rnd() < 0.15, made_by: who, recipe: flair ? "Manual espresso, 1:2.2" : "V60, 60 g/l",
        brew_scores: [{ attribute: "sour", score: sc(5 - ext * 1.6 + (rnd() - 0.5) * 2) }, { attribute: "sweet", score: sc(5 + (ci === 1 ? 2 : 1) - Math.abs(ext) + rnd()) }, { attribute: "bitter", score: sc(5 + ext * 1.6 + (ci === 2 ? 1.5 : 0) + (rnd() - 0.5) * 2) }].concat(rnd() < 0.7 ? [{ attribute: "body", score: sc(5 + (rnd() - 0.5) * 5 + ext * 0.6) }] : [])
          .concat(ci === 1 ? [{ attribute: "blueberry", score: rnd() < 0.6 ? 7 : 3 }] : ci === 0 ? [{ attribute: "panela", score: rnd() < 0.5 ? 7 : 3 }] : [{ attribute: "nutty", score: 7 }]) });
    }
  });
  // who tasted it: mostly whoever made it, sometimes both of you, now and then a guest
  brews.forEach((b, i) => {
    const other = b.made_by === "pa" ? "pb" : "pa", rid = k => b.id + k, cl = v => Math.max(1, Math.min(5, Math.round(v * 2) / 2));
    const own = rnd() < 0.3 ? other : b.made_by;   // brewed for the other one
    const ext = b.is_dialin ? 1.5 : Math.abs((b.brew_scores[2].score - b.brew_scores[0].score) / 4), bl = v => Math.max(0, Math.min(5, Math.round(v)));
    const milk = b.device !== "Hario V60" && rnd() < 0.45 ? (rnd() < 0.6 ? "oat" : "whole") : null;
    b.brew_ratings = [{ id: rid("a"), rater_id: own, is_guest: false, guest_name: null, rating: b.rating, balance: rnd() < 0.85 ? bl(4.3 - ext + (rnd() - 0.5)) : null, drink: milk ? "flat_white" : null, milk }];
    b.brew_scores.forEach(x => { x.rating_id = rid("a"); });
    if (b.rating != null && rnd() < 0.3) {
      const r2 = cl(b.rating + (own === "pa" ? -0.5 : 0.5) + (rnd() - 0.5));
      b.brew_ratings.push({ id: rid("b"), rater_id: own === "pa" ? "pb" : "pa", is_guest: false, guest_name: null, rating: r2, balance: bl(4 - ext + (rnd() - 0.5) * 1.5) });
      b.brew_scores = b.brew_scores.concat(b.brew_scores.filter(x => SCALE.isCore(x.attribute)).map(x => ({ attribute: x.attribute, score: Math.max(0, Math.min(10, x.score + Math.round((rnd() - 0.5) * 3))), rating_id: rid("b") })));
    }
    if (b.rating != null && rnd() < 0.07) b.brew_ratings.push({ id: rid("g"), rater_id: null, is_guest: true, guest_name: rnd() < 0.5 ? "Lena" : null, rating: cl(b.rating + 0.5) });
  });
  return { coffees, brews, names: { pa: "Birte (example)", pb: "Andres (example)" } };
}
function enterDemo() {
  const d = demo(); state.demo = true;
  state.coffees = d.coffees.map(c => Object.assign({}, c, { bag_g: c.bag_size_g || null })); state.names = d.names; state.brews = shape(d.brews, state.coffees);
  state.coffee = ""; state.device = ""; state.who = ""; state.rater = "";
  $("f-demo").textContent = "Back to my data"; fillFilters(); render();
}
function leaveDemo() {
  state.demo = false; state.coffees = []; state.brews = []; state.names = {}; state.coffee = ""; state.device = ""; state.who = ""; state.rater = "";
  $("f-demo").textContent = "Example data";
  if (state.signedIn) loadMine(); else { fillFilters(); render(); }
}

// ---------- events ----------
const saved = ({ time: "coffee", dial: "coffee", ins: "taste" })[store.get("alto.trends.view")] || store.get("alto.trends.view"); if (VIEWS[saved]) state.view = saved;
document.querySelectorAll(".tabs .tab").forEach(t => { t.onclick = () => { state.view = t.dataset.v; store.set("alto.trends.view", state.view); render(); }; });
$("f-coffee").onchange = () => { state.coffee = $("f-coffee").value; state.recipe = ""; render(); };
$("f-device").onchange = () => { state.device = $("f-device").value; render(); };
$("f-grinder").onchange = () => { state.grinderF = $("f-grinder").value; state.grinder = state.grinderF; render(); };
$("f-who").onchange = () => { state.who = $("f-who").value; render(); };
$("f-rater").onchange = () => { state.rater = $("f-rater").value; render(); };
// the time frame, remembered on this phone
const rangeShow = () => { $("f-dates").hidden = state.range !== "custom"; };
$("f-range").onchange = () => { state.range = $("f-range").value; store.set("alto.trends.range", JSON.stringify({ r: state.range, f: state.from, t: state.to })); rangeShow(); render(); };
["f-from", "f-to"].forEach(id => $(id).addEventListener("change", () => { state.from = $("f-from").value; state.to = $("f-to").value; store.set("alto.trends.range", JSON.stringify({ r: state.range, f: state.from, t: state.to })); render(); }));
try { const r = JSON.parse(store.get("alto.trends.range") || "null"); if (r) { state.range = r.r || ""; state.from = r.f || ""; state.to = r.t || ""; $("f-range").value = state.range; $("f-from").value = state.from; $("f-to").value = state.to; rangeShow(); } } catch (e) {}
$("f-demo").onclick = () => state.demo ? leaveDemo() : enterDemo();
let rz = null; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.brews.length) render(); }, 200); });

fillFilters(); render();
db.auth.onAuthStateChange((_e, session) => setTimeout(() => {
  const was = state.signedIn; state.signedIn = !!session; state.me = session ? session.user : null;
  if (state.demo) return;
  if (session && !was) loadMine(); else if (!session) { state.coffees = []; state.brews = []; fillFilters(); render(); }
}, 0));
</script>
