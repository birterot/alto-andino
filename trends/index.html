<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alto Andino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Trends | Alto Andino</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Chart colours. Flavours and people use a colour set that was checked for colour blindness and contrast
   (flavours: sour, sweet, bitter, balance in this fixed order; people: first and second person).
   Star ratings use one coffee-brown scale, light to dark (1 to 5 stars). */
:root{
  --f-sour:light-dark(#2a78d6,#3987e5);--f-sweet:light-dark(#eb6834,#d95926);--f-bitter:light-dark(#1baf7a,#199e70);--f-balance:light-dark(#eda100,#c98500);
  --p1:light-dark(#2a78d6,#3987e5);--p2:light-dark(#eb6834,#d95926);
  --r1:light-dark(#C29F72,#7D5A3B);--r2:light-dark(#AA8253,#9A7650);--r3:light-dark(#8C653A,#B8936A);--r4:light-dark(#6C4A28,#D3B08A);--r5:light-dark(#4C3118,#EBD2B0);
  --one:light-dark(#8A6A4A,#C4A27C);--one-track:light-dark(#E9DFD2,#3A332C);
  --grid:light-dark(#E6E0D6,#34302B);--axis:light-dark(#C9C0B2,#4A443D)
}
.tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;margin:16px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{flex:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.ctl select,.ctl button{font:inherit;font-size:14.5px;min-height:42px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background-color:var(--card);min-width:0;flex:1 1 150px;max-width:100%}
#f-coffee{flex-basis:100%}
.ctl button{flex:0 0 auto;padding:0 16px;cursor:pointer;color:var(--mut)}
ul.rank{list-style:none;margin:6px 0 0;padding:0}
ul.rank li{display:grid;grid-template-columns:auto minmax(0,1fr) 64px var(--vw,auto);align-items:center;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
ul.rank li:last-child{border-bottom:0}
ul.rank li:not(:has(svg)){grid-template-columns:minmax(0,1fr) 64px var(--vw,auto)}
ul.rank .rn{min-width:0;overflow-wrap:anywhere}
ul.rank .rn small{color:var(--mut);font-size:12.5px}
ul.rank .rt{height:6px;border-radius:3px;background:var(--one-track);overflow:hidden}
ul.rank .rf{display:block;height:100%;border-radius:3px;background:var(--one)}
ul.rank .rv{font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
ul.rank .di{width:22px;height:22px;fill:none;stroke:var(--one);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* Insights: the week grid, and the "needs more" note */
.heat{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:3px;margin:12px 0 4px;font-size:12px}
.heat .hh{text-align:center;color:var(--mut);padding-bottom:2px}
.heat .hr{color:var(--mut);padding-right:6px;align-self:center;font-size:12.5px}
.heat .hc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40px;border-radius:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.heat .hc b{font-size:13px;font-weight:600;line-height:1.1}.heat .hc small{font-size:10.5px;opacity:.8}
.heat .hc.dk{color:light-dark(#FBF6EE,#1E1B18)}
.heat .hc.none{background:var(--bg)}
.msg.need{color:var(--mut)}
/* What you like: your coffee type, one tile per kind, something to try next */
.typecard{margin:6px 0 14px;padding:16px 16px 14px;border-radius:14px;background:var(--one-track)}
.typecard .tk{margin:0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.typecard .tt{margin:6px 0 4px;font-size:21px;line-height:1.3;font-weight:600;color:var(--ink)}
.typecard .ts{margin:0;font-size:13.5px;color:var(--mut)}
.wtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 6px}
.wt{padding:12px 12px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.wt .wh{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.wt .wi{width:18px;height:18px;fill:none;stroke:var(--one);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wt b{display:block;margin-top:6px;font-size:17px;line-height:1.25}
.wt .wv{margin:3px 0 0;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.wt .wv strong{font-size:15px;color:var(--ink);margin-right:2px}
.wt .wv .up{color:var(--ink)}
.wt .wr{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.wt.close{border-style:dashed}
.trynext{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14.5px}
.likes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 28px}
.likes h3{margin:16px 0 0;font-size:15px}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:8px;border-radius:50%;color:#fff;font-size:12.5px;font-weight:600;flex:none}
.ctl .range{display:flex;align-items:center;gap:8px;flex:1 1 100%;font-size:14.5px;color:var(--mut)}
.ctl .range[hidden]{display:none}
.ctl .range input{flex:1 1 0;min-width:0;height:42px;margin:0;padding:0 12px;font:inherit;font-size:15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.banner{margin:0 0 14px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line);background:var(--card);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin:0 0 18px}
.card h2{margin:0;font-size:19px}
.card .what{margin:4px 0 10px;color:var(--mut);font-size:14px}
.card .take{margin:8px 0 2px;font-size:14.5px;color:var(--ink)}
.box{position:relative;width:100%}
.msg{padding:22px 8px;text-align:center;color:var(--mut);font-size:14px}
svg.ch{display:block;overflow:visible;touch-action:pan-y}
svg.ch text{font-size:12px;fill:var(--mut);font-variant-numeric:tabular-nums}
svg.ch .lab{font-size:12px}
svg.ch .grid{stroke:var(--grid);stroke-width:1}
svg.ch .base{stroke:var(--axis);stroke-width:1}
svg.ch .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .dot{stroke:var(--card);stroke-width:2}
svg.ch .dot.hollow{fill:var(--card);stroke-width:2}
svg.ch .cloud{fill:var(--mut);opacity:.28}
svg.ch .hit{fill:transparent}
svg.ch .pad{fill:transparent;outline:none}
svg.ch .hair{stroke:var(--axis);stroke-width:1}
svg.ch .trail{fill:none;stroke:var(--axis);stroke-width:1.5;stroke-linejoin:round}
svg.ch .lastring{fill:none;stroke:var(--ink);stroke-width:1.5}
svg.ch .zone{fill:var(--one);opacity:.08}
svg.ch .zlab{font-size:11.5px;fill:var(--mut)}
svg.ch .rl{fill:var(--ink);font-size:13px}
svg.ch .val{fill:var(--ink);font-size:13px;font-weight:600}
svg.ch .note{font-size:12px}
svg.ch .endlab{fill:var(--ink);font-size:12.5px}
svg.ch .stem{stroke:var(--axis);stroke-width:2}
svg.ch .pt.faded .dot{stroke:var(--card);stroke-width:1}
svg.ch .pt.hot .dot,svg.ch .bar.hot path,svg.ch .bar.hot .dot{filter:brightness(1.12)}
svg.ch g:focus{outline:none}
svg.ch g:focus-visible .hit{stroke:var(--ink);stroke-width:1.5}
.ctip{position:absolute;z-index:60;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(20,14,10,.18);font-size:13px;color:var(--ink)}
.ctip .ct{color:var(--mut);font-size:12px;margin-bottom:4px}
.ctip .cr{display:flex;align-items:center;gap:7px;line-height:1.5}
.ctip .cr b{font-weight:650}
.ctip .cr span{color:var(--mut)}
.ctip .kl{display:inline-block;width:12px;height:3px;border-radius:2px}
.ctip .kd{display:inline-block;width:9px;height:9px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 2px}
.leg{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:none;font:inherit;font-size:13px;color:var(--ink)}
button.leg{cursor:pointer}
.leg i{width:12px;height:3px;border-radius:2px;background:var(--col)}
.leg i.d{width:10px;height:10px;border-radius:50%}
.leg i.dash{width:16px;background:repeating-linear-gradient(90deg,var(--col) 0 4px,transparent 4px 7px)}
.leg i.h{width:8px;height:8px;border-radius:50%;background:none;border:2px solid var(--mut)}
.leg[aria-pressed=false]{opacity:.45}
.ramp{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.ramp i{display:inline-block;width:14px;height:10px;border-radius:3px}
.subctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.subctl select{font:inherit;font-size:14px;min-height:38px;border-radius:999px;flex:1 1 160px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 18px}
.grid2 h3{margin:12px 0 0;font-size:15px}
.grid2 .small{margin:2px 0 0;color:var(--mut);font-size:13px}
.balm{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;margin-top:8px;font-size:14px}
.balm .tr{height:8px;border-radius:4px;background:var(--one-track);overflow:hidden}
.balm .fl{display:block;height:100%;border-radius:4px;background:var(--one)}
.balm b{font-variant-numeric:tabular-nums}
.balm .small{grid-column:1/-1;margin:0;color:var(--mut);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:4px 0 6px}
.tile{padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.tile .tl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.tile .tl i{width:10px;height:10px;border-radius:50%;background:var(--col)}
.tile .tv{margin-top:2px;font-size:26px;font-weight:600;color:var(--ink)}
.tile .ts{font-size:13px;color:var(--mut)}
/* beans left: the open bags standing side by side on a shelf, each filled to what is left */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:92px;gap:10px;align-items:start;margin:14px -4px 4px;padding:0 4px 4px;overflow-x:auto;scrollbar-width:none;
  background:linear-gradient(var(--axis),var(--axis)) 0 92px/100% 3px no-repeat;background-attachment:local}
.shelf::-webkit-scrollbar{display:none}
.bagb{display:flex;flex-direction:column;align-items:center;text-align:center;color:inherit;text-decoration:none}
.bagb svg{width:70px;height:91px;overflow:visible;display:block}
.bagb b{margin-top:10px}
.bagb .bf{fill:var(--one);opacity:.85}
.bagb .bo{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.bagb .bo.thin{stroke-width:1}
.bagb b{font-size:13px;font-weight:600;line-height:1.25;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bagb small{font-size:12px;color:var(--mut);line-height:1.3}
.bagb.low small{color:var(--f-sweet)}
.shelfsum{margin:10px 0 0;font-size:14.5px}
/* origins: a world map, the countries you brewed coloured by how many coffees came from there */
.map{position:relative;margin:12px 0 4px}
.map svg{display:block;width:100%;height:auto;touch-action:pan-y}
.map .land{fill:var(--one-track)}
.map .cty{stroke:var(--card);stroke-width:.6;cursor:pointer;vector-effect:non-scaling-stroke}
.map .dot{stroke:var(--card);cursor:pointer}
.map .cty.hot,.map .dot.hot{stroke:var(--ink);stroke-width:2}
.map .belt{stroke:var(--axis);stroke-width:1;stroke-dasharray:4 5;fill:none;vector-effect:non-scaling-stroke}
.map .bl{fill:var(--mut);stroke:var(--card);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.mleg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.mleg i{display:inline-block;width:18px;height:10px;border-radius:2px}
details.num{margin:10px 0 0;font-size:14px}
details.num summary{cursor:pointer;color:var(--mut)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500}
.hint{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Trends</h1>
<p class="sub">What your brews tell you: how to dial in, when coffees taste best, what you like, and who brews what.</p>

<div class="tabs" role="tablist" aria-label="Trends sections">
  <button class="tab" role="tab" data-v="time" data-t="Over time">Over time</button>
  <button class="tab" role="tab" data-v="dial" data-t="Dial-in">Dial-in</button>
  <button class="tab" role="tab" data-v="fresh" data-t="Freshness">Freshness</button>
  <button class="tab" role="tab" data-v="taste" data-t="Taste">Taste</button>
  <button class="tab" role="tab" data-v="ins" data-t="Insights">Insights</button>
  <button class="tab" role="tab" data-v="us" data-t="Household">Household</button>
</div>

<div class="ctl" id="filters">
  <select id="f-coffee" aria-label="Coffee"></select>
  <select id="f-device" aria-label="Device"></select>
  <select id="f-who" aria-label="Made by"></select>
  <select id="f-rater" aria-label="Rated by"></select>
  <select id="f-range" aria-label="Time frame"><option value="">All time</option><option value="30">Last 30 days</option><option value="90">Last 3 months</option><option value="365">Last 12 months</option><option value="year">This year</option><option value="custom">Choose dates&hellip;</option></select>
  <span class="range" id="f-dates" hidden><input type="date" id="f-from" aria-label="From"><span>to</span><input type="date" id="f-to" aria-label="To"></span>
  <button id="f-demo" type="button">Example data</button>
</div>
<p class="banner" id="banner" hidden>Example data, to show how the charts look. These are not your brews.</p>

<div id="views"></div>
<p id="msg" class="hint" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/nav.js" defer></script>
<script src="../assets/js/scales.js"></script>
<script src="../assets/js/stars.js"></script>
<script src="../data/devices.js"></script>
<script src="../data/defaults.js"></script>
<script src="../data/world.js"></script>
<script src="../assets/js/people.js"></script>
<script src="../assets/js/caffeine.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
const db = supabase.createClient(SUPA.url, SUPA.key);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };
const CORE = SCALE.PROFILE;   // the taste sliders: sour, sweet, bitter (balance is its own 0 to 5 rating, b.balance)
const BCOL = "var(--f-balance)";
const balText = v => SCALE.balanceText(v);
const avgBal = list => { const v = list.map(b => b.balance).filter(x => x != null); return v.length ? { v: avg(v), n: v.length } : null; };   // unrated brews are left out, never counted as 0
const FCOL = { sour: "var(--f-sour)", sweet: "var(--f-sweet)", bitter: "var(--f-bitter)", balance: "var(--f-balance)" };
const RCOL = n => "var(--r" + Math.min(5, Math.max(1, Math.round(n))) + ")";   // half stars round to the nearer colour
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const D = window.DEFAULTS || {};

const state = { range: "", from: "", to: "", prefs: {}, view: "dial", freshC: "", demo: false, signedIn: false, me: null, coffees: [], brews: [], names: {}, coffee: "", device: "", who: "", rater: "", recipe: "", xk: "roast", hidden: new Set() };

// ---------- helpers ----------
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = n => Math.round(n * 10) / 10;
// dates the European way: dd-mm-yyyy (short dd-mm under the weekly columns)
const p2 = n => String(n).padStart(2, "0");
const fmtDate = d => p2(d.getDate()) + "-" + p2(d.getMonth() + 1) + "-" + d.getFullYear();
const fmtShort = d => p2(d.getDate()) + "-" + p2(d.getMonth() + 1);
const fmtIso = iso => { const [y, m, d] = String(iso).slice(0, 10).split("-"); return d + "-" + m + "-" + y; };
const mmss = n => Math.floor(n / 60) + ":" + String(Math.round(n % 60)).padStart(2, "0");
function typeOf(name) { return window.DEVICES && window.DEVICES.typeOf ? window.DEVICES.typeOf(name) : ""; }   // data/devices.js
const isEsp = dev => { const t = typeOf(dev); return t === "espresso" || t === ""; };
const timeText = b => b.time == null ? null : (isEsp(b.device) && b.time < 90 ? b.time + " s" : mmss(b.time) + " min");
const ratioOf = b => !b.dose ? null : isEsp(b.device) ? (b.yld ? b.yld / b.dose : null) : (b.water ? b.water / b.dose : b.yld ? b.yld / b.dose : null);
const numGrind = g => { const m = String(g || "").replace(",", ".").match(/-?\d+(\.\d+)?/); return m ? Number(m[0]) : null; };
const stars = n => Stars.text(n);
const splitOrigin = t => window.DEFAULTS && DEFAULTS.splitOrigin ? DEFAULTS.splitOrigin(t) : { country: t ? String(t).split(",")[0].trim() : null, region: null, countries: [] };
const andList = arr => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
const coffeeOf = id => state.coffees.find(c => c.id === id) || null;
const nameOf = id => (id && state.names[id]) || null;
const people = () => Object.keys(state.names).sort((a, b) => state.names[a].localeCompare(state.names[b]));
// each person's colour: the one they chose in Settings, otherwise the same automatic one as in Recent activity
const personCol = id => PEOPLE.color(id, nameOf(id), state.prefs, Object.keys(state.names));
const avatar = id => { const n = nameOf(id) || "?", a = el("span", "av", n.trim()[0].toUpperCase()); a.style.background = personCol(id); a.setAttribute("aria-hidden", "true"); return a; };
const shown = (a, v) => SCALE.isCore(a) ? v - 5 : v;   // stored -> -5..+5 for the four core flavours

// Several people can rate one brew. With "Rated by" set, a brew counts with that person's stars and taste
// (and only if they rated it); otherwise with the average of everyone who rated it.
const GUEST = "guest";
const raterKey = r => r.guest ? GUEST : r.who;
function asRated(b) {
  const rs = state.rater ? b.ratings.filter(r => raterKey(r) === state.rater) : b.ratings;
  if (state.rater && !rs.length) return null;
  const st = rs.map(r => r.rating).filter(v => v != null), sc = {}, n = {};
  rs.forEach(r => Object.entries(r.scores).forEach(([a, v]) => { sc[a] = (sc[a] || 0) + v; n[a] = (n[a] || 0) + 1; }));
  Object.keys(sc).forEach(a => { sc[a] = sc[a] / n[a]; });
  const bl = rs.map(r => r.balance).filter(v => v != null);
  return Object.assign({}, b, { rating: st.length ? avg(st) : null, balance: bl.length ? avg(bl) : null, scores: sc });
}
// brews after the device / person filters (and the coffee filter where the view uses it)
function filtered(useCoffee) {
  const [t0, t1] = rangeOf();
  return state.brews.filter(b => (!state.device || b.device === state.device) && (!state.who || b.who === state.who) && (!useCoffee || !state.coffee || b.coffeeId === state.coffee) && b.t >= t0 && b.t < t1).map(asRated).filter(Boolean);
}
// the time frame (Time frame filter): [from, to) as dates; all time unless you chose one
function rangeOf() {
  const now = new Date(), day = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  if (state.range === "year") return [new Date(now.getFullYear(), 0, 1), new Date(8.64e15)];
  if (/^\d+$/.test(state.range)) return [new Date(now.getTime() - Number(state.range) * 864e5), new Date(8.64e15)];
  if (state.range === "custom") { const a = state.from ? day(state.from) : new Date(-8.64e15), b = state.to ? day(state.to) : null; if (b) b.setDate(b.getDate() + 1); return [a, b || new Date(8.64e15)]; }
  return [new Date(-8.64e15), new Date(8.64e15)];
}

// A ranked list in plain HTML: icon (optional), the name (wraps, never cut off), a thin bar, the number
function rankList(rows) {
  const ul = el("ul", "rank");
  // the numbers column is as wide as its longest number on every row, so the bars line up

// ---------- 1 + 2: dial-in map and taste compass ----------
function viewDial() {
  let list = filtered(true);

    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    if (top && Object.keys(counts).length > 1) { list = list.filter(b => b.device === top); devNote = "Showing " + top + ", the device used most for this coffee. Pick another device above."; }
  }
  const dev = state.device || (list[0] && list[0].device) || "";
  const esp = isEsp(dev);

  const m = card("Dial-in map", "Grind setting against brew time. Each dot is a brew, darker means more stars. Look for the cluster of dark dots.");

    if (best) m.appendChild(el("p", "take", "Best so far: grind " + best.grind + ", " + timeText(best) + (ratioOf(best) ? ", ratio 1:" + r1(ratioOf(best)) : "") + " (" + stars(best.rating) + ", " + fmtDate(best.t) + ")."));
    numbers(m, ["Date", "Grind", "Time", "Ratio", "Stars", "Balance", "Made by"], pts.slice().sort((a, b) => a.t - b.t).map(b => [fmtDate(b.t) + (b.dialin ? " (dial-in)" : ""), b.grind, timeText(b), ratioOf(b) ? "1:" + r1(ratioOf(b)) : null, b.rating ? stars(b.rating) : null, b.balance != null ? balText(b.balance) : null, nameOf(b.who)]));

// ---------- 3: freshness curve ----------
function viewFresh() {

  const m = card("Freshness curve", "Stars against days after roast. Grey dots are single brews, the line is the average. Pick one coffee to see its own curve next to all coffees together.");
  if (every.length < 3) { empty(m, "Rate at least three brews of coffees with a roast date to see when they taste best."); return; }
  // one coffee or all of them
  const cnt = {}; every.forEach(b => { cnt[b.coffeeId] = (cnt[b.coffeeId] || 0) + 1; });
  const ids = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  if (state.freshC && !cnt[state.freshC]) state.freshC = "";
  if (ids.length > 1) {
    const sub = el("div", "subctl"), sel = el("select"); sel.setAttribute("aria-label", "Which coffee");
    [["", "All coffees together"]].concat(ids.map(id => { const c = coffeeOf(id); return [id, (c ? c.name : "Coffee") + (c && c.roast_date ? ", roasted " + fmtIso(c.roast_date) : "") + " · " + cnt[id]]; }))
      .forEach(([v, t]) => { const o = el("option", "", t); o.value = v; sel.appendChild(o); });
    sel.value = state.freshC; sel.onchange = () => { state.freshC = sel.value; render(); };

  Charts.lines({
    box, height: 300, xLabel: "Days after roast", yDomain: [0.5, 5.5], yTicks: [1, 2, 3, 4, 5], yFmt: v => v + "★",
    cloud: list.map(b => ({ x: b.dRoast, y: b.rating + jit(b) })),
    series,
    tipTitle: x => "Days " + (x - 1) + " to " + (x + 1) + " after roast",
    valueFmt: (sr, y, p) => y + "★ on average, " + p.n + (p.n === 1 ? " brew" : " brews")
  });
  const good = line.filter(p => p.n >= 2);
  const top = (good.length ? good : line).slice().sort((a, b) => b.y - a.y || b.n - a.n)[0];
  m.appendChild(el("p", "take", (one ? "So far " + one.name + " tastes best" : "So far your best brews come") + " around day " + (top.x - 1) + " to " + (top.x + 1) + " after roast (" + top.y + "★ on average)." + (good.length < 3 ? " This gets more reliable with more rated brews." : "")));
  numbers(m, ["Days after roast", "Average stars", "Brews"], line.map(p => [(p.x - 1) + " to " + (p.x + 1), p.y, p.n]));
}

// ---------- 4 + 5: what you like, flavour fingerprint ----------
function viewTaste() {
  const list = filtered(false).filter(b => b.rating && !b.dialin);
  const m = card("What you like", "From your rated brews (dial-ins left out): which kinds of coffee get your best stars.");
  const groups = [   // title, how to read it in the headline, icon, the kind of a coffee
    ["Process", x => x.toLowerCase(), "M12 3c3 4 5 6.5 5 9.5a5 5 0 01-10 0C7 9.5 9 7 12 3z", c => c.process],
    ["Roast", x => x.toLowerCase() + " roast", "M12 3c1 3 4 4.5 4 8.5a4 4 0 01-8 0c0-1.8.8-3 2-4 0 1.5.6 2.5 1.6 2.5C11.6 7.5 11 5 12 3z M7 20h10", c => c.roast_level],
    ["Origin", x => x, "M12 21s-6-5.5-6-10a6 6 0 1112 0c0 4.5-6 10-6 10z M12 9v.01", c => { const o = splitOrigin(c.origin); return o.countries.length > 1 ? "Several countries" : o.countries[0] || o.country; }],
    ["Altitude", x => /^Below/.test(x) ? "low-grown" : /2,100|1,800/.test(x) ? "high-grown" : null, "M3 19l6-10 4 6 2-3 6 7z", c => { const a = c.altitude_max_m != null ? (c.altitude_min_m + c.altitude_max_m) / 2 : c.altitude_min_m; if (a == null) return null; return a < 1200 ? "Below 1,200 m" : a < 1500 ? "1,200 to 1,500 m" : a < 1800 ? "1,500 to 1,800 m" : a < 2100 ? "1,800 to 2,100 m" : "2,100 m and up"; }],
    ["Region", x => null, "M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z M9 4v14 M15 6v14", c => { const o = splitOrigin(c.origin); return o.region && o.countries.length < 2 ? o.region.split(",")[0].trim() + " (" + (o.countries[0] || o.country) + ")" : null; }]
  ];
  if (!list.length) { empty(m, "Rate a few brews (outside dial-ins) to see what you like."); }
  else {
    const all = avg(list.map(b => b.rating)), res = [];
    groups.forEach(([title, word, icon, key]) => {
      const by = {};
      list.forEach(b => { const c = coffeeOf(b.coffeeId); const k = c && key(c); if (k) (by[k] = by[k] || []).push(b.rating); });
      const rows = Object.keys(by).map(k => ({ label: k, value: avg(by[k]), n: by[k].length })).sort((x, y) => y.value - x.value || y.n - x.n);
      if (rows.length) res.push({ title, word, icon, rows, clear: rows.length > 1 && rows[0].n >= 2 && rows[0].value - rows[1].value >= 0.25 });
    });
    // 1. the headline: what kind of coffee person you are, as far as it shows yet
    const pick = t => res.find(g => g.title === t && g.clear), adj = ["Process", "Roast", "Altitude"].map(t => pick(t)).filter(Boolean).map(g => g.word(g.rows[0].label)).filter(Boolean);
    const org = pick("Origin"), who = adj.join(", ") + (org && org.rows[0].label !== "Several countries" ? (adj.length ? " " : "") + org.rows[0].label : "");
    const hl = el("div", "typecard");
    hl.appendChild(el("p", "tk", "Your coffee type"));
    hl.appendChild(el("p", "tt", who ? "You\u2019re a " + who + " coffee person." : "Still making up your mind: no clear favourite yet."));
    hl.appendChild(el("p", "ts", "Your average: " + r1(all).toFixed(1) + "\u2605 over " + list.length + (list.length === 1 ? " rated brew." : " rated brews.")));
    m.appendChild(hl);
    // 2. one tile per kind of coffee with more than one kind: the winner, how far ahead of your average, and the runner-up
    const tiles = el("div", "wtiles");
    res.filter(g => g.rows.length > 1 && g.title !== "Region").forEach(g => {
      const w = g.rows[0], d = w.value - all, t = el("div", "wt" + (g.clear ? "" : " close"));
      const NS = "http://www.w3.org/2000/svg", sv = document.createElementNS(NS, "svg"), pa = document.createElementNS(NS, "path");
      sv.setAttribute("viewBox", "0 0 24 24"); sv.setAttribute("class", "wi"); sv.setAttribute("aria-hidden", "true"); pa.setAttribute("d", g.icon); sv.appendChild(pa);
      const hd = el("div", "wh"); hd.append(sv, el("span", "", g.title)); t.appendChild(hd);
      t.appendChild(el("b", "", w.label));
      const wv = el("p", "wv"); wv.appendChild(el("strong", "", r1(w.value).toFixed(1) + "\u2605"));
      if (Math.abs(d) >= 0.05) wv.appendChild(el("span", d > 0 ? "up" : "", " " + (d > 0 ? "+" : "\u2212") + r1(Math.abs(d)).toFixed(1) + "\u2605 vs your average"));
      t.appendChild(wv);
      t.appendChild(el("p", "wr", g.clear ? "ahead of " + g.rows[1].label + " (" + r1(g.rows[1].value).toFixed(1) + "\u2605)" : "close race with " + g.rows[1].label + " (" + r1(g.rows[1].value).toFixed(1) + "\u2605)"));
      tiles.appendChild(t);
    });
    if (tiles.children.length) m.appendChild(tiles);
    // everything else, folded away
    const more = el("details", "num"); more.appendChild(el("summary", "", "Show all kinds"));
    const body = el("div", "likes");
    res.forEach(g => { const d = el("div", "lg"); d.appendChild(el("h3", "", g.title)); d.appendChild(rankList(g.rows.map(r => ({ label: r.label, sub: "(" + r.n + ")", value: r.value, max: 5, text: r1(r.value).toFixed(1) + "\u2605" })))); body.appendChild(d); });
    more.appendChild(body); m.appendChild(more);
    // 4. something to try next: a kind you liked but had only once, or a big coffee country you have not had yet
    const tries = [];
    res.filter(g => g.title !== "Region" && g.title !== "Altitude").forEach(g => g.rows.filter(r => r.n === 1 && r.value >= all).forEach(r => tries.push("You\u2019ve had " + (g.title === "Origin" ? "coffee from " + r.label : g.word(r.label)) + " only once so far (" + r1(r.value).toFixed(1) + "\u2605). Worth another try?")));

    ["Ethiopia", "Kenya", "Colombia", "Guatemala", "Rwanda", "Costa Rica", "Panama", "Brazil", "Burundi", "Honduras"].filter(c => !had.has(c)).slice(0, 3).forEach(c => tries.push("Nothing from " + c + " yet. Maybe the next bag?"));
    if (tries.length) { const tn = el("p", "trynext"); tn.append(el("b", "", "Try next: "), document.createTextNode(tries[Math.floor(Date.now() / 864e5) % tries.length])); m.appendChild(tn); }
  }

  sweetSpot();
  const f = card("Flavour fingerprint", "The average sour, sweet and bitter of each coffee, from -5 to +5 (0 is just right), and its Balance from 0 to 5. Dial-in brews are left out of the Balance.");

      const parts = [];
      if (g.d) parts.push(mk("path", { d: g.d, class: "cty", fill: shade(r.n) }));
      if (g.s || !g.d) dots.push([r, mk("circle", { cx: g.x, cy: g.y, r: Math.max(5, 22 * k), class: "dot", fill: shade(r.n), "stroke-width": 4 * k })]);
      parts.forEach(p => { p.dataset.k = r.name; svg.appendChild(p); });

  numbers(m, ["Country", "Coffees", "Brews", "Average stars"], rows.map(r => [r.name, r.n, r.brews, r.avg != null ? r1(r.avg).toFixed(1) : ""]));
}

// ---------- render ----------
// ---------- Insights: what all the logged data says, as charts with one plain sentence each ----------
// Stars are compared within the same coffee (and device, where settings only make sense per device), so a great bag
// does not make its settings look great. Every chart says how much more it needs until there is enough to show.
const numOf = v => { const x = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(x) ? x : null; };
const grpOf = b => { const c = coffeeOf(b.coffeeId); return c ? (c.group_id || c.id) : b.coffeeId; };
const fmtS = v => r1(v).toFixed(1) + "\u2605";
const needMore = (box, text) => box.appendChild(el("p", "msg need", text));
const WEEK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function viewInsights() {
  const list = filtered(false), rated = list.filter(b => b.rating != null);
  if (rated.length < 5) { const c = card("Insights", null); empty(c, "Insights need a few rated brews first: " + (5 - rated.length) + " more and the first charts appear."); return; }
  insFactors(rated.filter(b => !b.dialin));
  insDialCurve(rated);
  insOpenBag(rated.filter(b => !b.dialin));
  insWhen(rated.filter(b => !b.dialin));
  insMilk(rated.filter(b => !b.dialin));
  insSleep();
}

// 1. What moves your stars: for each setting, the stars above its usual value against below it, within one coffee
function insFactors(list) {
  const m = card("What moves your stars", "How much each thing changes your stars, compared within the same coffee (and device). The longer the bar, the more it matters.");
  const dev = b => grpOf(b) + "|" + (b.device || ""), ratio = b => b.dose ? (b.yld ? b.yld / b.dose : b.water ? b.water / b.dose : null) : null;
  const NUM = [   // label, value, group, [word for lower, word for higher]
    ["Grind", b => numOf(b.grind), dev, ["a lower grind number", "a higher grind number"]],
    ["Ratio", ratio, dev, ["a stronger ratio (less water)", "a longer ratio (more water)"]],
    ["Dose", b => numOf(b.dose), dev, ["less coffee", "more coffee"]],
    ["Water temperature", b => numOf(b.temp), dev, ["cooler water", "hotter water"]],
    ["Brew time", b => numOf(b.time), dev, ["shorter brews", "longer brews"]],
    ["Days after roast", b => b.dRoast, grpOf, ["fresher beans", "older beans"]],
    ["Time of day", b => b.t.getHours() + b.t.getMinutes() / 60, grpOf, ["earlier in the day", "later in the day"]]
  ];
  const CAT = [["Device", b => b.device || null, grpOf], ["Who brewed", b => b.who ? nameOf(b.who) || null : null, grpOf]];
  const res = [], thin = [];
  NUM.forEach(([label, get, gk, words]) => {
    const by = {}; list.forEach(b => { const v = get(b); if (v != null) (by[gk(b)] = by[gk(b)] || []).push([v, b.rating]); });
    let sw = 0, sd = 0, n = 0;
    Object.values(by).forEach(xs => {
      if (xs.length < 4) return;
      const vs = xs.map(x => x[0]).sort((a, b) => a - b), med = (vs[Math.floor((vs.length - 1) / 2)] + vs[Math.ceil((vs.length - 1) / 2)]) / 2;
      const hi = xs.filter(x => x[0] > med).map(x => x[1]), lo = xs.filter(x => x[0] < med).map(x => x[1]);
      if (!hi.length || !lo.length) return;
      const w = Math.min(hi.length, lo.length); sw += w; sd += w * (avg(hi) - avg(lo)); n += hi.length + lo.length;
    });
    if (n < 6) { thin.push([label, 6 - n]); return; }
    const d = sd / sw; res.push({ label, v: Math.abs(d), sub: Math.abs(d) < 0.15 ? "barely matters" : "better with " + words[d > 0 ? 1 : 0], n });
  });
  CAT.forEach(([label, get, gk]) => {
    const by = {}; list.forEach(b => { const v = get(b); if (v) (by[gk(b)] = by[gk(b)] || []).push([v, b.rating]); });
    const adj = {}; let n = 0;
    Object.values(by).forEach(xs => {
      const kinds = {}; xs.forEach(([k, r]) => (kinds[k] = kinds[k] || []).push(r));
      const ok = Object.keys(kinds).filter(k => kinds[k].length >= 2); if (ok.length < 2) return;
      const mean = avg(ok.flatMap(k => kinds[k]));
      ok.forEach(k => { (adj[k] = adj[k] || []).push(...kinds[k].map(r => r - mean)); n += kinds[k].length; });
    });
    const ks = Object.keys(adj).map(k => [k, avg(adj[k])]).sort((a, b) => b[1] - a[1]);
    if (ks.length < 2) { thin.push([label, null]); return; }
    const d = ks[0][1] - ks[ks.length - 1][1];
    res.push({ label, v: d, sub: d < 0.15 ? "barely matters" : "best: " + ks[0][0], n });
  });
  if (!res.length) { needMore(m, "Log the same coffee a few times with different settings: at least 4 rated brews of one coffee (on one device) are needed."); return; }
  res.sort((a, b) => b.v - a.v);
  const big = res.filter(r => r.v >= 0.2).slice(0, 2), small = res.filter(r => r.v < 0.15);
  m.appendChild(el("p", "take", (big.length ? "What matters most for your stars: " + andList(big.map(r => r.label.toLowerCase())) + "." : "Nothing makes a big difference yet: your settings are already close, or there are only a few brews.") +
    (small.length ? " " + small.slice(0, 2).map(r => r.label).join(" and ") + (small.length === 1 ? " barely matters." : " barely matter.") : "")));
  m.appendChild(rankList(res.map(r => ({ label: r.label, sub: r.sub, value: r.v, max: Math.max(1, res[0].v), text: r1(r.v).toFixed(1) + "\u2605" }))));
  if (thin.length) m.appendChild(el("p", "what", "Not enough yet for " + andList(thin.map(t => t[0].toLowerCase())) + ": that needs a few brews of one coffee where it changes."));
  numbers(m, ["What", "Change in stars", "Brews compared", "What it says"], res.map(r => [r.label, r1(r.v).toFixed(2), r.n, r.sub]));
}

// 2. Your dial-in curve: the stars of brew 1, 2, 3 ... of each bag
function insDialCurve(list) {
  const m = card("Your dial-in curve", "The average stars of the first, second, third ... brew of each bag. Grey dots are single brews.");
  const bags = {}; list.forEach(b => (bags[b.coffeeId] = bags[b.coffeeId] || []).push(b));
  const long = Object.values(bags).filter(x => x.length >= 3);
  if (long.length < 2) { needMore(m, "This needs at least two bags with three rated brews each" + (long.length ? " (one so far)." : ".")); return; }
  const at = {}, cloud = [];
  long.forEach(xs => xs.slice().sort((a, b) => a.t - b.t).forEach((b, i) => { const k = Math.min(8, i + 1); (at[k] = at[k] || []).push(b.rating); cloud.push({ x: k + ((b.id.charCodeAt(1) % 5) - 2) * 0.06, y: b.rating }); }));
  const pts = Object.keys(at).map(Number).sort((a, b) => a - b).map(k => ({ x: k, y: r1(avg(at[k])), n: at[k].length }));
  const late = pts.filter(p => p.x >= 4), plateau = late.length ? avg(late.flatMap(p => at[p.x])) : pts[pts.length - 1].y;
  const first = pts[0].y, ready = pts.find(p => p.y >= plateau - 0.15) || pts[pts.length - 1];
  m.appendChild(el("p", "take", first < plateau - 0.2
    ? "The first cup of a new bag gets " + fmtS(first) + " on average, from brew " + ready.x + " on about " + fmtS(plateau) + ": it takes you about " + ready.x + " brews to dial in a new coffee."
    : first > plateau + 0.2 ? "Your first cups of a new bag are your best ones (" + fmtS(first) + ", later about " + fmtS(plateau) + "): maybe the beans are at their best then, or later brews drift."
    : "No real dip: your first cup of a new bag is already about as good as the later ones (" + fmtS(first) + " against " + fmtS(plateau) + ")."));
  const box = chartBox(m);
  Charts.lines({ box, height: 240, xLabel: "Brew of the bag", xDomain: [0.5, 8.5], yDomain: [0.5, 5.5], yTicks: [1, 2, 3, 4, 5], yFmt: v => v + "\u2605", xFmt: v => v === 8 ? "8+" : String(v),
    cloud, series: [{ name: "Average", color: "var(--one)", points: pts }], tipTitle: x => "Brew " + (x === 8 ? "8 and later" : x) + " of a bag", valueFmt: (sr, y, p) => y + "\u2605 on average, " + p.n + (p.n === 1 ? " brew" : " brews") });
  numbers(m, ["Brew of the bag", "Average stars", "Brews"], pts.map(p => [p.x === 8 ? "8+" : p.x, p.y, p.n]));
}

// 3. Does an open bag fade? Stars by week since opening (each bag against its own average), and how fast a bag goes
function insOpenBag(list) {
  const m = card("Does an open bag fade?", "Your stars by week since opening, each bag against its own average, so only the time open counts.");
  const bags = {}; list.filter(b => b.dOpen != null && b.dOpen >= 0).forEach(b => (bags[b.coffeeId] = bags[b.coffeeId] || []).push(b));
  const all = list.length ? avg(list.map(b => b.rating)) : 0, wk = {};
  Object.values(bags).filter(xs => xs.length >= 3).forEach(xs => { const mean = avg(xs.map(b => b.rating)); xs.forEach(b => { const w = Math.min(6, Math.floor(b.dOpen / 7)); (wk[w] = wk[w] || []).push(b.rating - mean); }); });
  const pts = Object.keys(wk).map(Number).sort((a, b) => a - b).filter(w => wk[w].length >= 2).map(w => ({ x: w + 1, y: r1(all + avg(wk[w])), n: wk[w].length }));
  // how long a bag lasts: opened to finished, or (for open bags) the pace so far
  const done = state.coffees.filter(c => c.open_date && c.finished_at).map(c => Math.max(1, Math.round((new Date(c.finished_at) - new Date(c.open_date + "T00:00:00")) / 864e5)));
  const pace = done.length ? "You finish a bag in about " + Math.round(avg(done)) + " days after opening (" + done.length + (done.length === 1 ? " bag)." : " bags).") : "";
  if (pts.length < 2) { needMore(m, "This needs a few rated brews in more than one week of an open bag." + (pace ? " " + pace : "")); return; }
  const base = pts[0].y, drop = pts.find(p => p.y <= base - 0.3);
  m.appendChild(el("p", "take", (drop ? "After about " + (drop.x - 1) + (drop.x - 1 === 1 ? " week" : " weeks") + " open, your stars drop by " + r1(base - drop.y).toFixed(1) + "\u2605." : "Your stars hold up while a bag is open: no clear drop yet.") + (pace ? " " + pace : "")));
  const box = chartBox(m);
  Charts.lines({ box, height: 220, xLabel: "Week since opening", yFmt: v => v + "\u2605", xFmt: v => v === 7 ? "7+" : String(v), series: [{ name: "Stars", color: "var(--one)", points: pts }],
    tipTitle: x => "Week " + (x === 7 ? "7 and later" : x) + " since opening", valueFmt: (sr, y, p) => y + "\u2605, " + p.n + (p.n === 1 ? " brew" : " brews") });
  numbers(m, ["Week since opening", "Stars (adjusted)", "Brews"], pts.map(p => [p.x === 7 ? "7+" : p.x, p.y, p.n]));
}

// 4. When you brew best: a week of mornings, middays, afternoons and evenings, coloured by stars
function insWhen(list) {
  const m = card("When you brew best", "Your stars by day and time of day. The stronger the colour, the better for you; the small number is how many brews.");
  if (list.length < 8) { needMore(m, "This needs " + (8 - list.length) + " more rated brews."); return; }
  const PART = [["Morning", h => h >= 5 && h < 11], ["Midday", h => h >= 11 && h < 14], ["Afternoon", h => h >= 14 && h < 18], ["Evening", h => h >= 18 || h < 5]];
  const cell = {}; list.forEach(b => { const d = (b.t.getDay() + 6) % 7, p = PART.findIndex(x => x[1](b.t.getHours())); (cell[d + "|" + p] = cell[d + "|" + p] || []).push(b.rating); });
  const g = el("div", "heat"); g.setAttribute("role", "table"); g.setAttribute("aria-label", "Stars by day and time of day");
  g.appendChild(el("span", "hh"));
  WEEK.forEach(d => g.appendChild(el("span", "hh", d)));
  const used = PART.map((_, p) => WEEK.some((_, d) => cell[d + "|" + p]));
  // the shades go from your lowest to your highest slot, so the differences show (whatever stars you usually give)
  const avgs = Object.values(cell).map(avg), lo = Math.min(...avgs), hi = Math.max(...avgs), lvOf = a => hi - lo < 0.01 ? 3 : 1 + Math.round(4 * (a - lo) / (hi - lo));
  PART.forEach(([name], p) => {
    if (!used[p]) return;
    g.appendChild(el("span", "hr", name));
    WEEK.forEach((dn, d) => {
      const xs = cell[d + "|" + p], c = el("span", "hc");
      if (xs) { const a = avg(xs), lv = lvOf(a); c.style.background = "var(--r" + lv + ")"; if (lv >= 4) c.classList.add("dk"); c.append(el("b", "", r1(a).toFixed(1)), el("small", "", String(xs.length))); c.title = dn + " " + name.toLowerCase() + ": " + fmtS(a) + " over " + xs.length + (xs.length === 1 ? " brew" : " brews"); }
      else c.classList.add("none");
      g.appendChild(c);
    });
  });
  // the sentence: weekend against weekday mornings, or else the best slot with enough brews
  const morn = days => days.flatMap(d => cell[d + "|0"] || []), wd = morn([0, 1, 2, 3, 4]), we = morn([5, 6]);
  const slots = Object.keys(cell).filter(k => cell[k].length >= 3).map(k => [k, avg(cell[k])]).sort((a, b) => b[1] - a[1]);
  let txt = "";
  if (wd.length >= 3 && we.length >= 3 && Math.abs(avg(we) - avg(wd)) >= 0.2) txt = "Weekend mornings rate " + r1(Math.abs(avg(we) - avg(wd))).toFixed(1) + "\u2605 " + (avg(we) > avg(wd) ? "higher" : "lower") + " than weekday mornings.";
  else if (slots.length) { const [k, a] = slots[0], [d, p] = k.split("|").map(Number); txt = "Your best time so far: " + ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"][d] + " " + PART[p][0].toLowerCase() + "s, " + fmtS(a) + " on average."; }
  const most = Object.keys(cell).sort((a, b) => cell[b].length - cell[a].length)[0], [md, mp] = most.split("|").map(Number);
  m.appendChild(el("p", "take", (txt ? txt + " " : "") + "You brew most on " + ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"][md] + " " + PART[mp][0].toLowerCase() + "s (" + cell[most].length + ")."));
  m.appendChild(g);
  const rows = []; PART.forEach(([name], p) => WEEK.forEach((dn, d) => { const xs = cell[d + "|" + p]; if (xs) rows.push([dn + " " + name.toLowerCase(), r1(avg(xs)).toFixed(1), xs.length]); }));
  numbers(m, ["When", "Average stars", "Brews"], rows);
}

// 5. Milk or black: the same coffees, with and without milk
function insMilk(list) {
  const m = card("Milk or black", "The same coffee with and without milk: your stars side by side.");
  const isMilk = r => !!r.milk || /latte|flat|cappu|cortado|macchiato|milk|au_lait|lait|piccolo/i.test(r.drink || "");
  const by = {}, types = {};
  list.forEach(b => b.ratings.forEach(r => {
    if (r.rating == null) return;
    const k = grpOf(b), x = by[k] = by[k] || { black: [], milk: [] };
    (isMilk(r) ? x.milk : x.black).push(r.rating);
    if (r.milk) (types[r.milk] = types[r.milk] || []).push(r.rating);
  }));
  const rows = Object.keys(by).filter(k => by[k].black.length && by[k].milk.length).map(k => { const c = state.coffees.find(x => (x.group_id || x.id) === k); return { label: c ? c.name : "Coffee", a: avg(by[k].black), b: avg(by[k].milk), na: by[k].black.length, nb: by[k].milk.length }; });
  if (!rows.length) { needMore(m, "This needs a coffee you rated both black and with milk."); return; }
  const d = avg(rows.map(r => r.b - r.a));
  m.appendChild(el("p", "take", Math.abs(d) < 0.15 ? "Milk or black makes little difference to your stars (" + rows.length + (rows.length === 1 ? " coffee)." : " coffees).")
    : "With milk your cups rate " + r1(Math.abs(d)).toFixed(1) + "\u2605 " + (d > 0 ? "higher" : "lower") + " than black, on the same coffee (" + rows.length + (rows.length === 1 ? " coffee)." : " coffees).")));
  const leg = el("div", "legend"); legendItem(leg, "var(--r5)", "Black", "dot"); legendItem(leg, "var(--r2)", "With milk", "dot"); m.appendChild(leg);
  const box = chartBox(m);
  Charts.dumbbell({ box, domain: [1, 5], fmt: v => v + "\u2605", colors: ["var(--r5)", "var(--r2)"], rows: rows.map(r => ({ label: r.label, a: r.a, b: r.b, tip: () => ({ title: r.label, rows: [{ value: fmtS(r.a), label: "black (" + r.na + ")", color: "var(--r5)", kind: "dot" }, { value: fmtS(r.b), label: "with milk (" + r.nb + ")", color: "var(--r2)", kind: "dot" }] }) })) });
  const tl = Object.keys(types).filter(k => types[k].length >= 2).map(k => ({ label: k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, " ") + " milk", value: avg(types[k]), n: types[k].length })).sort((a, b) => b.value - a.value);
  if (tl.length > 1) { m.appendChild(el("h3", "", "By milk")); m.appendChild(rankList(tl.map(r => ({ label: r.label, sub: "(" + r.n + ")", value: r.value, max: 5, text: fmtS(r.value) })))); }
  numbers(m, ["Coffee", "Black", "With milk"], rows.map(r => [r.label, r1(r.a).toFixed(1) + " (" + r.na + ")", r1(r.b).toFixed(1) + " (" + r.nb + ")"]));
}

// 6. Caffeine and sleep (only with the Sleep check on): the caffeine left at your bedtime against how you slept
function insSleep() {
  const p = (state.me && state.prefs[state.me.id]) || {};
  if (state.demo || p.sleep !== "on" || !p.sleep_consent || !Array.isArray(state.sleep) || !window.CAFFEINE) return;
  const m = card("Caffeine and sleep", "The caffeine still in you at your bedtime (from your own cups) against how you slept that night. Only you see this.");
  const line = p.caf_line != null && Number(p.caf_line) >= 0 ? Number(p.caf_line) : 50, bed = /^\d\d:\d\d$/.test(p.caf_bed || "") ? p.caf_bed : "22:30";
  const me = state.me.id, doses = [];
  (state.raw || []).forEach(b => {
    const c = state.coffees.find(x => x.id === b.coffee_id), r = CAFFEINE.row(b, c), k = r.r.indexOf(me);
    if (k < 0 || !(r.g > 0)) return;
    doses.push({ t: Date.parse(r.rt[k] || r.t), mg: CAFFEINE.mg(r).mg / r.r.length });
  });
  const nights = state.sleep.map(s => {
    const [y, mo, d] = s.night.split("-").map(Number), [hh, mm] = bed.split(":").map(Number), at = new Date(y, mo - 1, d, hh, mm);
    if (hh < 12) at.setDate(at.getDate() + 1);   // a bedtime after midnight belongs to the night before
    return { mg: CAFFEINE.level(doses, at.getTime()), q: s.quality };
  });
  if (nights.length < 6) { needMore(m, "This needs " + (6 - nights.length) + " more answers to the Sleep check."); return; }
  const B = [["0\u201325 mg", 0, 25], ["25\u201350 mg", 25, 50], ["50\u2013100 mg", 50, 100], ["100+ mg", 100, 1e9]];
  const rows = B.map(([label, lo, hi]) => { const xs = nights.filter(n => n.mg >= lo && n.mg < hi); return { label, n: xs.length, well: xs.length ? xs.filter(n => n.q === 3).length / xs.length : null, bad: xs.length ? xs.filter(n => n.q === 1).length / xs.length : null }; }).filter(r => r.n);
  const under = nights.filter(n => n.mg < line), over = nights.filter(n => n.mg >= line), pw = xs => Math.round(100 * xs.filter(n => n.q === 3).length / xs.length);
  m.appendChild(el("p", "take", under.length >= 2 && over.length >= 2
    ? "Under your sleep line (" + line + " mg) at bedtime you slept well on " + pw(under) + "% of nights (" + under.length + "), above it on " + pw(over) + "% (" + over.length + ")."
    : "Most nights you were " + (over.length > under.length ? "above" : "under") + " your sleep line (" + line + " mg) at bedtime, so there is nothing to compare yet."));
  const box = chartBox(m);
  Charts.hbars({ box, domain: [0, 100], xTicks: [0, 50, 100], color: "var(--one)", xFmt: v => v + "%", rows: rows.map(r => ({ label: r.label, value: Math.round(100 * r.well), text: Math.round(100 * r.well) + "% slept well", sub: "(" + r.n + ")", tip: () => ({ title: r.label + " at bedtime", rows: [{ value: Math.round(100 * r.well) + "%", label: "slept well" }, { value: Math.round(100 * r.bad) + "%", label: "slept badly" }, { value: String(r.n), label: r.n === 1 ? "night" : "nights" }] }) })) });
  numbers(m, ["Caffeine at bedtime", "Nights", "Slept well", "Slept badly"], rows.map(r => [r.label, r.n, Math.round(100 * r.well) + "%", Math.round(100 * r.bad) + "%"]));
  m.appendChild(el("p", "what", "A rough guide: caffeine is worked out from your cups (see Settings, Caffeine), and sleep has many other reasons."));
}

const VIEWS = { time: viewTime, dial: viewDial, fresh: viewFresh, taste: viewTaste, ins: viewInsights, us: viewUs };
function render() {
  Charts.hideTip();
  document.querySelectorAll(".tabs .tab").forEach(t => { const on = t.dataset.v === state.view; t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1; });
  $("f-coffee").hidden = !(state.view === "time" || state.view === "dial");
  $("banner").hidden = !state.demo;
  $("views").textContent = "";
  if (!state.demo && !state.signedIn) { const c = card("Sign in first", null); empty(c, "Sign in on the Coffee Shelf, then come back here. Until then, tap \"Example data\" to see how the charts look."); return; }
  if (!state.brews.length) { const c = card("No brews yet", null); empty(c, "Log a few brews on the Coffee Shelf and the charts appear here. Tap \"Example data\" to see how they will look."); return; }
  if (state.range && !filtered(false).length) { const c = card("Nothing in this time frame", null); empty(c, "No brews between these dates. Pick a longer time frame above."); return; }
  VIEWS[state.view]();
}
function fillFilters() {
  const fill = (id, first, items, keep) => {
    const s = $(id); s.textContent = "";
    const o = el("option", "", first); o.value = ""; s.appendChild(o);
    items.forEach(([v, t]) => { const x = el("option", "", t); x.value = v; s.appendChild(x); });
    s.value = items.some(i => i[0] === keep) ? keep : "";
    return s.value;
  };
  const counts = {}; state.brews.forEach(b => { counts[b.coffeeId] = (counts[b.coffeeId] || 0) + 1; });
  const cs = state.coffees.filter(c => counts[c.id]).sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
  if (!state.coffee || !counts[state.coffee]) state.coffee = cs.length ? cs[0].id : "";
  const csel = $("f-coffee"); csel.textContent = "";
  cs.forEach(c => { const o = el("option", "", c.name + (c.roast_date ? ", roasted " + fmtIso(c.roast_date) : "") + (c.archived ? " (archived)" : "") + " · " + counts[c.id]); o.value = c.id; csel.appendChild(o); });
  if (!cs.length) { const o = el("option", "", "No coffees with brews"); o.value = ""; csel.appendChild(o); }
  csel.value = state.coffee;
  const devs = [...new Set(state.brews.map(b => b.device).filter(Boolean))].sort();
  state.device = fill("f-device", "All devices", devs.map(d => [d, d]), state.device);
  const ppl = people().filter(id => state.brews.some(b => b.who === id));
  state.who = fill("f-who", "Made by anyone", ppl.map(id => [id, "Made by " + state.names[id]]), state.who);
  $("f-who").hidden = ppl.length < 2;
  // rated by: everyone who rated something, and guests
  const rated = people().filter(id => state.brews.some(b => b.ratings.some(r => !r.guest && r.who === id)));
  const guests = state.brews.some(b => b.ratings.some(r => r.guest));
  state.rater = fill("f-rater", "Rated by anyone", rated.map(id => [id, "Rated by " + state.names[id]]).concat(guests ? [[GUEST, "Rated by guests"]] : []), state.rater);
  $("f-rater").hidden = rated.length + (guests ? 1 : 0) < 2;
}

// ---------- data ----------
function shape(raw, coffees) {
  return raw.map(b => {
    const t = new Date(b.brewed_at), c = coffees.find(x => x.id === b.coffee_id), scores = {};
    (b.brew_scores || []).forEach(x => { scores[x.attribute] = x.score; });
    // everyone who rated it (supabase/19_brew_ratings.sql); a brew from before: one rating, by whoever made it
    const sco = id => { const o = {}; (b.brew_scores || []).filter(x => x.rating_id === id).forEach(x => { o[x.attribute] = x.score; }); return o; };
    const ratings = (b.brew_ratings || []).length
      ? b.brew_ratings.map(r => ({ who: r.is_guest ? null : r.rater_id, guest: !!r.is_guest, name: r.guest_name || null, rating: r.rating == null ? null : Number(r.rating), balance: r.balance == null ? null : Number(r.balance), scores: sco(r.id), drink: r.drink || null, milk: r.milk || null }))
      : (b.rating != null || (b.brew_scores || []).length ? [{ who: b.made_by || b.created_by || null, guest: false, name: null, rating: b.rating == null ? null : Number(b.rating), balance: null, scores }] : []);
    const day = iso => iso ? Math.floor((t - new Date(iso + "T00:00:00")) / 864e5) : null;
    return { id: b.id, coffeeId: b.coffee_id, t, device: b.device, grind: b.grind, dose: b.dose_g, yld: b.yield_g, water: b.water_g, time: b.time_s, temp: b.temp_c,
      rating: b.rating == null ? null : Number(b.rating), dialin: !!b.is_dialin, recipe: b.recipe, who: b.made_by || b.created_by || null, ratings, scores, dRoast: c ? day(c.roast_date) : null, dOpen: c ? day(c.open_date) : null };
  });
}
async function loadMine() {
  $("msg").textContent = "Loading...";
  // the household chosen in the Journal (after supabase/15_households.sql); before that, everything you can see
  let hh = null;
  const hm = await db.from("household_members").select("household_id").eq("user_id", state.me.id);
  if (!hm.error && hm.data.length) { const saved = store.get("alto.household"); hh = (hm.data.find(x => x.household_id === saved) || hm.data[0]).household_id; }
  const cq = db.from("coffees").select("*");
  const [cs, bs, ps, sl] = await Promise.all([
    (hh ? cq.eq("household_id", hh) : cq).order("created_at", { ascending: false }),
    db.from("brews").select("*, brew_ratings(id,rater_id,is_guest,guest_name,rating,balance,drink,milk,drank_at), brew_scores(attribute,score,rating_id)").order("brewed_at"),
    db.from("profiles").select("id,display_name,prefs"),
    db.from("sleep_logs").select("night,quality")   // your own answers to the Sleep check (only you can read them); before supabase/31_sleep.sql: an error, left out
  ]);
  $("msg").textContent = "";
  if (cs.error || bs.error) { $("msg").textContent = "Could not load: " + (cs.error || bs.error).message; return; }
  state.coffees = cs.data.map(c => Object.assign({}, c, { bag_g: c.bag_size_g || null }));
  state.names = {}; state.prefs = {};
  (ps.data || []).forEach(p => { state.names[p.id] = p.display_name; state.prefs[p.id] = p.prefs || {}; });
  const ids = new Set(state.coffees.map(c => c.id));
  state.raw = bs.data.filter(b => ids.has(b.coffee_id));
  state.brews = shape(state.raw, state.coffees);
  state.sleep = sl && !sl.error && Array.isArray(sl.data) ? sl.data : null;
  fillFilters(); render();
}

// Example data: made up, only to show how the charts look.
function demo() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const day = n => { const d = new Date(); d.setHours(8, 0, 0, 0); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  const coffees = [
    { id: "d1", name: "Colombia Huila", origin: "Colombia, Huila", process: "Washed", roast_level: "Light", altitude_min_m: 1700, altitude_max_m: 1900, roast_date: day(40), open_date: day(34), bag_size_g: 1000 },
    { id: "d2", name: "Ethiopia Guji", origin: "Ethiopia, Guji", process: "Natural", roast_level: "Medium-light", altitude_min_m: 2000, altitude_max_m: 2200, roast_date: day(30), open_date: day(22), bag_size_g: 340 },
    { id: "d3", name: "Brazil Cerrado", origin: "Brazil, Cerrado", process: "Pulped natural", roast_level: "Medium-dark", altitude_min_m: 1100, roast_date: day(55), open_date: day(48), bag_size_g: 1000, archived: false }
  ];
  const brews = []; let n = 0;
  coffees.forEach((c, ci) => {
    const roast = Math.round((Date.now() - new Date(c.roast_date + "T00:00:00")) / 864e5), opened = Math.round((Date.now() - new Date(c.open_date + "T00:00:00")) / 864e5);
    for (let d = opened; d >= 0; d -= 1 + Math.floor(rnd() * 3)) {
      const flair = rnd() < 0.72, age = roast - d, who = rnd() < 0.55 ? "pa" : "pb";
      const grind = flair ? 18 + Math.floor(rnd() * 12) : 55 + Math.floor(rnd() * 25);
      const time = flair ? Math.round(20 + (30 - grind) * 2.6 + rnd() * 10) : Math.round(150 + (80 - grind) * 2 + rnd() * 30);
      const ext = flair ? (time - 42) / 6 : (time - 200) / 25;   // + is over, - is under
      const fresh = -Math.abs(age - 14) / 9;
      const rating = Math.max(1, Math.min(5, Math.round(4.2 - Math.abs(ext) * 0.7 + fresh + (who === "pa" ? 0.2 : -0.2) + (ci === 1 ? 0.3 : 0) + (rnd() - 0.5))));
      const dose = flair ? 18 : 30, yld = flair ? Math.round(36 + rnd() * 12) : 440, water = flair ? null : 500;
      const sc = (v) => Math.max(0, Math.min(10, Math.round(v)));
      brews.push({ id: "b" + (++n) + "x", coffee_id: c.id, brewed_at: new Date(Date.now() - d * 864e5 - rnd() * 3e6).toISOString(), device: flair ? "Manual espresso machine" : "Hario V60",
        grind: String(grind), dose_g: dose, yield_g: yld, water_g: water, time_s: time, temp_c: flair ? 93 : 88 + Math.floor(rnd() * 9), rating: rnd() < 0.9 ? rating : null, is_dialin: rnd() < 0.15, made_by: who, recipe: flair ? "Manual espresso, 1:2.2" : "V60, 60 g/l",
        brew_scores: [{ attribute: "sour", score: sc(5 - ext * 1.6 + (rnd() - 0.5) * 2) }, { attribute: "sweet", score: sc(5 + (ci === 1 ? 2 : 1) - Math.abs(ext) + rnd()) }, { attribute: "bitter", score: sc(5 + ext * 1.6 + (ci === 2 ? 1.5 : 0) + (rnd() - 0.5) * 2) }].concat(rnd() < 0.7 ? [{ attribute: "body", score: sc(5 + (rnd() - 0.5) * 5 + ext * 0.6) }] : [])
          .concat(ci === 1 ? [{ attribute: "blueberry", score: rnd() < 0.6 ? 7 : 3 }] : ci === 0 ? [{ attribute: "panela", score: rnd() < 0.5 ? 7 : 3 }] : [{ attribute: "nutty", score: 7 }]) });
    }
  });
  // who tasted it: mostly whoever made it, sometimes both of you, now and then a guest
  brews.forEach((b, i) => {
    const other = b.made_by === "pa" ? "pb" : "pa", rid = k => b.id + k, cl = v => Math.max(1, Math.min(5, Math.round(v * 2) / 2));
    const own = rnd() < 0.3 ? other : b.made_by;   // brewed for the other one
    const ext = b.is_dialin ? 1.5 : Math.abs((b.brew_scores[2].score - b.brew_scores[0].score) / 4), bl = v => Math.max(0, Math.min(5, Math.round(v)));
    const milk = b.device !== "Hario V60" && rnd() < 0.45 ? (rnd() < 0.6 ? "oat" : "whole") : null;
    b.brew_ratings = [{ id: rid("a"), rater_id: own, is_guest: false, guest_name: null, rating: b.rating, balance: rnd() < 0.85 ? bl(4.3 - ext + (rnd() - 0.5)) : null, drink: milk ? "flat_white" : null, milk }];
    b.brew_scores.forEach(x => { x.rating_id = rid("a"); });
    if (b.rating != null && rnd() < 0.3) {
      const r2 = cl(b.rating + (own === "pa" ? -0.5 : 0.5) + (rnd() - 0.5));
      b.brew_ratings.push({ id: rid("b"), rater_id: own === "pa" ? "pb" : "pa", is_guest: false, guest_name: null, rating: r2, balance: bl(4 - ext + (rnd() - 0.5) * 1.5) });
      b.brew_scores = b.brew_scores.concat(b.brew_scores.filter(x => SCALE.isCore(x.attribute)).map(x => ({ attribute: x.attribute, score: Math.max(0, Math.min(10, x.score + Math.round((rnd() - 0.5) * 3))), rating_id: rid("b") })));
    }
    if (b.rating != null && rnd() < 0.07) b.brew_ratings.push({ id: rid("g"), rater_id: null, is_guest: true, guest_name: rnd() < 0.5 ? "Lena" : null, rating: cl(b.rating + 0.5) });
  });
  return { coffees, brews, names: { pa: "Birte (example)", pb: "Andres (example)" } };
}
function enterDemo() {
  const d = demo(); state.demo = true;
  state.coffees = d.coffees.map(c => Object.assign({}, c, { bag_g: c.bag_size_g || null })); state.names = d.names; state.brews = shape(d.brews, state.coffees);
  state.coffee = ""; state.device = ""; state.who = ""; state.rater = "";

}
function leaveDemo() {
  state.demo = false; state.coffees = []; state.brews = []; state.names = {}; state.coffee = ""; state.device = ""; state.who = ""; state.rater = "";
  $("f-demo").textContent = "Example data";

["f-from", "f-to"].forEach(id => $(id).addEventListener("change", () => { state.from = $("f-from").value; state.to = $("f-to").value; store.set("alto.trends.range", JSON.stringify({ r: state.range, f: state.from, t: state.to })); render(); }));

db.auth.onAuthStateChange((_e, session) => setTimeout(() => {
